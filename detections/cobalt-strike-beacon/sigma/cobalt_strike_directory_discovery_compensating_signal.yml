title: "Aggregates multi-class LDAP directory queries by user and host, independent of any single process, to surface discovery distributed across multiple short-lived processes in the same session."
name: cobalt_strike_directory_discovery_compensating_signal
status: experimental
correlation:
  type: value_count
  rules:
    - cobalt_strike_directory_discovery_compensating_signal_base
  group-by:
    - user_id
    - hostname
  timespan: 30m
  condition:
    field: object_class
    gte: 4
