title: "Correlates an inbound connection to a process with that same process subsequently creating multiple distinct outbound connections, detecting the relay/forwarding topology that the base outbound-only fan-out rule cannot express."
name: cobalt_strike_socket_fanout_or_forwarding_compensating_signal
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - cobalt_strike_socket_fanout_or_forwarding_compensating_signal_first
    - cobalt_strike_socket_fanout_or_forwarding_compensating_signal_second
  group-by:
    - hostname
    - relay_process
  timespan: 15m
  aliases:
    relay_process:
