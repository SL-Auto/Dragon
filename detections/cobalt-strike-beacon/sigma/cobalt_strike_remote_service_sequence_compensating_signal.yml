title: "Correlates a file staged to a remote target with a subsequent System 7045 service install on that target whose service image file name equals the staged file name, tightening the base rule's looser source/account/host proximity join; file-name matching tolerates UNC versus local path forms."
name: cobalt_strike_remote_service_sequence_compensating_signal_first
status: experimental
description: "Correlates a file staged to a remote target with a subsequent System 7045 service install on that target whose service image file name equals the staged file name, tightening the base rule's looser source/account/host proximity join; file-name matching tolerates UNC versus local path forms."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_remote_service_sequence_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, product_event_type, hostname, target_host, target_path, target_process_path); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Two base rules plus a Sigma temporal_ordered correlation. Regex-derived join values are not expressible in Sigma; the correlation groups on host keys only. Joined on service host and image file name; the staging source host exists only on the write leg (as in the canonical rule, where $source is bound by the write event)."
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_remote_service_sequence.md"
procedure_ids: "CSB-030"
log_source_prerequisites: "Normalize FILE_CREATION/FILE_MODIFICATION written to a remote target host (SMB/admin-share write with source and target host and full path), and System 7045 on that target with the installed service image path, joined on source host, target host and image file name within 10 minutes, write first."
logsource:
  service: system
  product: windows
detection:
  sel:
    event_type:
      - "FILE_CREATION"
      - "FILE_MODIFICATION"
      - "FILE_WRITE"
  condition: sel
falsepositives:
  - "Software distribution and endpoint-management tools that stage an installer to a share and then register it as a service using the identical path."
level: high
