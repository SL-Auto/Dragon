title: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
name: cobalt_strike_remote_management_execution_compensating_signal_first
status: experimental
description: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_remote_management_execution_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, user_id, process_path, source_ip); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Two base rules plus a Sigma temporal_ordered correlation."
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_remote_management_execution.md; reviews/cobalt-strike-beacon/detection-review.md#dr-23"
procedure_ids: "CSB-031,CSB-032,CSB-033"
log_source_prerequisites: "Target-side WINRM_SESSION, WMI_REMOTE_OPERATION or SSH_AUTH events with target host and account, plus PROCESS_LAUNCH on the same host where principal.process is the launching (parent) process, joined on host and account within 10 minutes, session first."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type:
      - "WINRM_SESSION"
      - "WMI_REMOTE_OPERATION"
      - "SSH_AUTH"
  condition: sel
falsepositives:
  - "Remote administration, configuration management (DSC, Ansible over WinRM/SSH), monitoring and patching that run commands through WinRM, WMI or SSH."
level: medium
---
title: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
name: cobalt_strike_remote_management_execution_compensating_signal_second
status: experimental
description: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
    process_path|re: "(?i)(\\\\(wsmprovhost|wmiprvse|sshd)\\.exe|/sshd)$"
  condition: sel
falsepositives:
  - "Remote administration, configuration management (DSC, Ansible over WinRM/SSH), monitoring and patching that run commands through WinRM, WMI or SSH."
level: medium
---
title: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
name: cobalt_strike_remote_management_execution_compensating_signal
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - cobalt_strike_remote_management_execution_compensating_signal_first
    - cobalt_strike_remote_management_execution_compensating_signal_second
  group-by:
    - hostname
    - user_id
  timespan: 10m
level: medium
