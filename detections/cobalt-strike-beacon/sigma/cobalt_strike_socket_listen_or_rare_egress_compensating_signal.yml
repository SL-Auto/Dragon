title: "Correlates a rare-process socket listen with an accepted inbound connection on the same port and process, closing the gap between merely listening and actually receiving a connection that the base standalone-listen rule leaves open."
name: cobalt_strike_socket_listen_or_rare_egress_compensating_signal
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - cobalt_strike_socket_listen_or_rare_egress_compensating_signal_first
    - cobalt_strike_socket_listen_or_rare_egress_compensating_signal_second
  group-by:
    - hostname
    - listen_process
    - target_port
  timespan: 30m
  aliases:
    listen_process:
      cobalt_strike_socket_listen_or_rare_egress_compensating_signal_first: process_id
      cobalt_strike_socket_listen_or_rare_egress_compensating_signal_second: target_process_id
level: high
