title: "Correlates a rare-process socket listen with an accepted inbound connection on the same port and process, closing the gap between merely listening and actually receiving a connection that the base standalone-listen rule leaves open."
name: cobalt_strike_socket_listen_or_rare_egress_compensating_signal_second
status: experimental
description: "Correlates a rare-process socket listen with an accepted inbound connection on the same port and process, closing the gap between merely listening and actually receiving a connection that the base standalone-listen rule leaves open."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type: "NETWORK_CONNECTION"
    direction: "INBOUND"
