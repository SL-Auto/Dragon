title: "Correlates execution of a file with deletion of that same file path by an unsigned or rare process shortly afterward, covering self-deleting-artifact cleanup that the base rarity-only rule does not tie to prior execution."
name: cobalt_strike_file_cleanup_or_timestomp_compensating_signal
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - cobalt_strike_file_cleanup_or_timestomp_compensating_signal_first
    - cobalt_strike_file_cleanup_or_timestomp_compensating_signal_second
  group-by:
    - hostname
    - file_path
  timespan: 15m
  aliases:
    file_path:
      cobalt_strike_file_cleanup_or_timestomp_compensating_signal_first: target_process_path
      cobalt_strike_file_cleanup_or_timestomp_compensating_signal_second: target_path
level: medium
