title: "Detects repeated process-attributed TXT/NULL-type DNS queries to domains flagged as rare by baseline enrichment, covering low-volume record-type-specific tunneling exchanges that the length/entropy-based base rule does not filter by record type."
name: cobalt_strike_dns_process_context_compensating_signal_base
status: experimental
description: "Detects repeated process-attributed TXT/NULL-type DNS queries to domains flagged as rare by baseline enrichment, covering low-volume record-type-specific tunneling exchanges that the length/entropy-based base rule does not filter by record type."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_dns_process_context_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_id, dns_query, dns_type, domain_baseline_rarity); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_dns_process_context.md"
procedure_ids: "CSB-006"
log_source_prerequisites: "Normalize process-attributed NETWORK_DNS (for example Sysmon 22 or EDR DNS events; DNS Client service-attributed resolver logs cannot attribute the requesting process) with host, process ID, query name/type, and a domain-rarity baseline enrichment field."
logsource:
  category: dns_query
  product: windows
detection:
  sel:
    event_type:
      - "NETWORK_DNS"
      - "DNS_QUERY"
    domain_baseline_rarity: "RARE"
  alt0_0:
    dns_type: 16
  alt0_1:
    dns_type: 10
  condition: sel and 1 of alt0_*
falsepositives:
  - "Mail-security appliances and anti-abuse services performing bulk legitimate TXT lookups against rare or newly observed domains; the rarity enrichment must be tenant-tuned before enabling."
level: medium
