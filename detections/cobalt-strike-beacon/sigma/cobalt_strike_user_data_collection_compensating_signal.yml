fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_id, direction); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Two base rules plus a Sigma temporal_ordered correlation."
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_user_data_collection.md"
procedure_ids: "CSB-027"
log_source_prerequisites: "Normalize vendor SCREEN_CAPTURE/CLIPBOARD_READ/INPUT_CAPTURE/BROWSER_SECRET_READ and outbound NETWORK_CONNECTION with a stable vendor process identifier (product_specific_process_id), joined on host and process within 15 minutes, collection first."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type:
      - "SCREEN_CAPTURE"
      - "CLIPBOARD_READ"
      - "INPUT_CAPTURE"
      - "BROWSER_SECRET_READ"
  condition: sel
falsepositives:
  - "Assistive technology, conferencing, remote support, password managers, browsers, and approved monitoring software that both collect and transmit data as part of normal operation."
level: high
