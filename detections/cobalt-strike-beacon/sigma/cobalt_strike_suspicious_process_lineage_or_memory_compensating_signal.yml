title: "Correlates a private executable-memory region without a backing file with a subsequent thread start whose start address falls in that private region, on the same process, providing execution evidence that the base rule's standalone memory-allocation signal cannot express."
name: cobalt_strike_suspicious_process_lineage_or_memory_compensating_signal_first
status: experimental
description: "Correlates a private executable-memory region without a backing file with a subsequent thread start whose start address falls in that private region, on the same process, providing execution evidence that the base rule's standalone memory-allocation signal cannot express."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_suspicious_process_lineage_or_memory_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_id, memory_is_private, memory_has_backing_file, start_address_in_private_rx, approved_jit_host); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Two base rules plus a Sigma temporal_ordered correlation."
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_suspicious_process_lineage_or_memory.md"
procedure_ids: "CSB-004,CSB-014,CSB-016"
log_source_prerequisites: "Normalize EXECUTABLE_MEMORY with private/backing-file attributes and THREAD_START with start-address-in-region and expected-JIT-host enrichment, joined on host and PID within 5 minutes."
logsource:
  category: create_remote_thread
  product: windows
detection:
  sel:
    event_type: "EXECUTABLE_MEMORY"
    memory_is_private: "true"
    memory_has_backing_file: false
  condition: sel
falsepositives:
  - "JIT runtimes (browsers, .NET, JVM), application virtualization, and approved dynamic-code frameworks not reflected in the JIT-host enrichment."
level: high
