log_source_prerequisites: "Normalize PROCESS_LAUNCH with target integrity level, parent process signer and prevalence, and an approved-elevation-broker enrichment."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
    integrity_level: "SYSTEM"
  alt0_0:
    process_signed: false
  alt0_1:
    process_prevalence: "RARE"
  filter0:
    approved_elevation_broker: true
  condition: sel and 1 of alt0_* and not filter0
falsepositives:
  - "Installers, driver-installation flows, and approved elevation-broker components not reflected in the enrichment allowlist."
level: high
