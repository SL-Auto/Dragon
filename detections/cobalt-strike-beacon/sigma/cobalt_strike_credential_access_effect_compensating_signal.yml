title: "Correlates dangerous-rights LSASS process access with creation of a memory-dump artifact by the same process, narrowing the broad LSASS/store/replication effect rule to an ordered access-plus-artifact sequence."
name: cobalt_strike_credential_access_effect_compensating_signal_first
status: experimental
description: "Correlates dangerous-rights LSASS process access with creation of a memory-dump artifact by the same process, narrowing the broad LSASS/store/replication effect rule to an ordered access-plus-artifact sequence."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_credential_access_effect_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_id, target_process_path, dangerous_memory_rights, target_path); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Two base rules plus a Sigma temporal_ordered correlation."
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_credential_access_effect.md"
procedure_ids: "CSB-028"
log_source_prerequisites: "Normalize EDR PROCESS_OPEN against lsass.exe with a granted-access/dangerous-rights enrichment field, plus FILE_CREATION for .dmp/.mdmp targets, joined on host and process ID (stable vendor process ID preferred) within a 5-minute window, open before dump."
logsource:
  category: process_access
  product: windows
detection:
  sel:
    event_type: "PROCESS_OPEN"
    target_process_path|re: "(?i)\\\\lsass\\.exe$"
    dangerous_memory_rights: "true"
  condition: sel
falsepositives:
  - "EDR/AV LSASS scanners, Procdump-based support workflows, Windows Error Reporting crash dumps, and forensic acquisition tools that also create .dmp files."
level: high
---
title: "Correlates dangerous-rights LSASS process access with creation of a memory-dump artifact by the same process, narrowing the broad LSASS/store/replication effect rule to an ordered access-plus-artifact sequence."
name: cobalt_strike_credential_access_effect_compensating_signal_second
status: experimental
description: "Correlates dangerous-rights LSASS process access with creation of a memory-dump artifact by the same process, narrowing the broad LSASS/store/replication effect rule to an ordered access-plus-artifact sequence."
logsource:
  category: process_access
  product: windows
detection:
  sel:
    event_type: "FILE_CREATION"
    target_path|re: "(?i)\\.(dmp|mdmp)$"
  condition: sel
falsepositives:
  - "EDR/AV LSASS scanners, Procdump-based support workflows, Windows Error Reporting crash dumps, and forensic acquisition tools that also create .dmp files."
level: high
