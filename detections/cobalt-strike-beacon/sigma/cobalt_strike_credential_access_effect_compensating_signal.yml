title: "Correlates dangerous-rights LSASS process access with creation of a memory-dump artifact by the same process, narrowing the broad LSASS/store/replication effect rule to an ordered access-plus-artifact sequence."
name: cobalt_strike_credential_access_effect_compensating_signal
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - cobalt_strike_credential_access_effect_compensating_signal_first
    - cobalt_strike_credential_access_effect_compensating_signal_second
  group-by:
    - hostname
    - process_id
  timespan: 5m
level: high
