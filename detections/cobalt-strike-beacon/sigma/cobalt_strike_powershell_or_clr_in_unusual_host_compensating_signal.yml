title: "Detects CLR/CoreCLR module load either into a native Windows host binary that is not a .NET application (the sacrificial-process pattern used for in-memory assembly execution) or into a process that is both unsigned and rare, providing an alternate detection path when runtime-expected/CLR_RUNTIME_LOAD telemetry is unavailable."
name: cobalt_strike_powershell_or_clr_in_unusual_host_compensating_signal
status: experimental
description: "Detects CLR/CoreCLR module load either into a native Windows host binary that is not a .NET application (the sacrificial-process pattern used for in-memory assembly execution) or into a process that is both unsigned and rare, providing an alternate detection path when runtime-expected/CLR_RUNTIME_LOAD telemetry is unavailable."
source_yaral: "detections/cobalt-strike-beacon/yaral/cobalt_strike_powershell_or_clr_in_unusual_host_compensating_signal.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, target_path, process_path, process_signed, process_prevalence); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Single-event Sigma rule. "
references:
  - "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_powershell_or_clr_in_unusual_host.md"
procedure_ids: "CSB-015,CSB-017"
log_source_prerequisites: "Normalize MODULE_LOAD (Sysmon 7 or EDR image load) for clr.dll/coreclr.dll with loading process image path, signer and prevalence."
logsource:
  category: image_load
  product: windows
detection:
  sel:
    event_type: "MODULE_LOAD"
    target_path|re: "(?i)\\\\(clr|coreclr)\\.dll$"
  alt0_0:
    process_path|re: "(?i)\\\\(rundll32|dllhost|regsvr32|werfault|searchprotocolhost|gpupdate|spoolsv|notepad|svchost|wuauclt|mstsc)\\.exe$"
  alt0_1:
    process_signed: false
    process_prevalence: "RARE"
  condition: sel and 1 of alt0_*
falsepositives:
  - "Custom .NET hosts, IDEs, installers, and management agents that legitimately embed the CLR in an uncommon or unsigned process."
level: high
