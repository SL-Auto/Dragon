title: "Correlates one process reading two independent sensitive-store families (credential manager/Vault versus crypto/certificate/Hello, IIS, SCCM/Citrix or RDM stores) as a stronger compensating signal for broad single-path store access."
name: mimikatz_sensitive_store_multi_family_access
status: experimental
description: "Correlates one process reading two independent sensitive-store families as a stronger compensating signal for the broad mimikatz_sensitive_store_access rule."
source_yaral: "detections/mimikatz/yaral/mimikatz_sensitive_store_multi_family_access.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
assumptions_and_gaps: "Candidate retrieval is translated; canonical entity joins, ordering, windows, and cardinality (the family-A vs family-B path split) must be implemented and tested in the target backend. Sigma correlation rules (type: temporal) with a group-by on process/host/user are required to express the two-family join and are not included in this selection-only placeholder."
references:
  - "reports/mimikatz/source-analysis.md"
  - "public-rules/comparisons/mimikatz/mimikatz_sensitive_store_access.md"
procedure_ids: "P18,P19,P20,P23,P25,P37,P41,P46"
log_source_prerequisites: "EDR sensitive file or registry read telemetry with process, host and user identity, sufficient to distinguish at least two of: Credential Manager/Vault; DPAPI/crypto/certificate/Hello key stores; IIS configuration; SCCM/VSS/Citrix; Remote Desktop Manager."
logsource:
  category: generic
detection:
  selection_event_type:
    event.code: ["FILE_READ", "REGISTRY_READ"]
  condition: selection_event_type
falsepositives:
  - "Backup, migration, credential-manager, endpoint-security and IT-provisioning tools that legitimately enumerate more than one store family in a session."
level: high
