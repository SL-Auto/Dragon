title: "Detects an image/DLL load event where the loading process is lsass.exe or the print spooler service."
name: mimikatz_module_load_into_lsass_or_spooler
status: experimental
description: "Detects an image/DLL load event where the loading process is lsass.exe or the print spooler service, a narrower compensating signal for mimilib/mimispool-style module loading."
source_yaral: "detections/mimikatz/yaral/mimikatz_module_load_into_lsass_or_spooler.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
assumptions_and_gaps: "Candidate retrieval is translated; map canonical UDM fields to the target schema and verify every predicate before enabling. Raw event ID \"7\" must be confirmed to mean Sysmon Image Load in the target sensor."
references:
  - "reports/mimikatz/source-analysis.md"
  - "public-rules/comparisons/mimikatz/mimikatz_service_driver_module_change.md"
procedure_ids: "P06,P36,P44,P45"
log_source_prerequisites: "Sysmon Event ID 7 (image/DLL load) or equivalent EDR module-load telemetry, normalized with the loading process image path."
logsource:
  category: image_load
  product: windows
detection:
  selection_event_type:
    EventID: 7
  selection_loading_process:
    Image|endswith:
      - '\lsass.exe'
      - '\spoolsv.exe'
  condition: selection_event_type and selection_loading_process
falsepositives:
  - "Legitimate LSA authentication packages/security support providers, antivirus and EDR self-injection into LSASS, and normal print-monitor or driver DLLs loaded into the spooler service."
level: high
