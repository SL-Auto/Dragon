title: "Detects one principal performing two or more kinds of Cognito identity-creation actions within 30 minutes: CreateUserPool, CreateUserPoolClient, CreateIdentityPool, AdminCreateUser or AdminUpdateUserAttributes."
name: pacu_cognito_pool_abuse
