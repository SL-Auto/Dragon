title: "Detects CreateTrail or RunInstances requests whose name or tag value begins with a spreadsheet formula character (=, +, -, @), used to inject formulas into exported CloudTrail logs."
name: pacu_log_formula_injection
status: experimental
correlation:
  type: event_count
  rules:
    - pacu_log_formula_injection_base
  group-by:
    - principal_arn
  timespan: 60m
  condition:
    gte: 1
level: medium
