title: "Detects one principal registering an ECS task definition and running a task within 30 minutes, used to execute attacker commands under the task role."
name: pacu_ecs_task_definition_run
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - pacu_ecs_task_definition_run_first
    - pacu_ecs_task_definition_run_second
  group-by:
    - principal_arn
  timespan: 30m
level: medium
