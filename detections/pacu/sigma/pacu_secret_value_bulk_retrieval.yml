title: "Detects one principal retrieving five or more distinct secret values within 30 minutes through Secrets Manager GetSecretValue, or SSM GetParameter(s) with decryption, excluding calls invoked by AWS services (PA-DR-09)."
name: pacu_secret_value_bulk_retrieval_base
status: experimental
description: "Detects one principal retrieving five or more distinct secret values within 30 minutes through Secrets Manager GetSecretValue, or SSM GetParameter(s) with decryption, excluding calls invoked by AWS services (PA-DR-09)."
source_yaral: "detections/pacu/yaral/pacu_secret_value_bulk_retrieval.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, resource_name, with_decryption, invoked_by); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md; public-rules/comparisons/pacu/pacu_secret_value_bulk_retrieval.md"
procedure_ids: "PA-P08"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; secretId or parameter name in target.resource.name; requestParameters.withDecryption and userIdentity.invokedBy in additional.fields."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
  alt0_0:
    product_event_type:
      - "GetSecretValue"
      - "BatchGetSecretValue"
  alt0_1:
    product_event_type:
      - "GetParameter"
      - "GetParameters"
      - "GetParametersByPath"
    with_decryption|re: "(?i)^true$"
  filter0:
    invoked_by|re: "(?i)(AWS Internal|\\.amazonaws\\.com)$"
  condition: sel and 1 of alt0_* and not filter0
falsepositives:
  - "Secret-rotation tooling, migration scripts and configuration-management agents reading many parameters."
level: high
---
title: "Detects one principal retrieving five or more distinct secret values within 30 minutes through Secrets Manager GetSecretValue, or SSM GetParameter(s) with decryption, excluding calls invoked by AWS services (PA-DR-09)."
name: pacu_secret_value_bulk_retrieval
status: experimental
correlation:
  type: value_count
  rules:
    - pacu_secret_value_bulk_retrieval_base
  group-by:
    - principal_arn
  timespan: 30m
  condition:
    field: resource_name
    gte: 5
level: high
