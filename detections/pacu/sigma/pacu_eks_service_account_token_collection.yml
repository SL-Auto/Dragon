title: "Detects one identity reading Kubernetes service-account tokens or secrets across three or more namespaces within 30 minutes in EKS audit logs."
name: pacu_eks_service_account_token_collection_base
status: experimental
description: "Detects one identity reading Kubernetes service-account tokens or secrets across three or more namespaces within 30 minutes in EKS audit logs."
source_yaral: "detections/pacu/yaral/pacu_eks_service_account_token_collection.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, user_id, namespace); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
procedure_ids: "PA-P15"
log_source_prerequisites: "EKS control-plane audit logs normalized with verb and resource in metadata.product_event_type (for example get secrets, create serviceaccounts/token), user in principal.user.userid and namespace in target.namespace."
logsource:
  category: eks_audit
  product: aws
detection:
  sel:
    product_event_type|re: "(?i)(get|list|watch|create).*(secrets|serviceaccounts/token)"
  condition: sel
falsepositives:
  - "Cluster administrators and secret-sync controllers."
level: high
---
title: "Detects one identity reading Kubernetes service-account tokens or secrets across three or more namespaces within 30 minutes in EKS audit logs."
name: pacu_eks_service_account_token_collection
status: experimental
correlation:
  type: value_count
  rules:
    - pacu_eks_service_account_token_collection_base
  group-by:
    - user_id
  timespan: 30m
  condition:
    field: namespace
    gte: 3
level: high
