title: "Detects one principal issuing service access credentials of two or more kinds within 30 minutes: Lightsail key pairs or temporary SSH access, or API Gateway API keys."
name: pacu_service_credential_issuance_base
status: experimental
description: "Detects one principal issuing service access credentials of two or more kinds within 30 minutes: Lightsail key pairs or temporary SSH access, or API Gateway API keys."
source_yaral: "detections/pacu/yaral/pacu_service_credential_issuance.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, resource_name); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
procedure_ids: "PA-P06"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type:
      - "CreateKeyPair"
      - "ImportKeyPair"
      - "GetInstanceAccessDetails"
      - "CreateApiKey"
    event_source|re: "(?i)(lightsail|apigateway)"
  condition: sel
falsepositives:
  - "Lightsail administrators and API publishers."
level: medium
---
title: "Detects one principal issuing service access credentials of two or more kinds within 30 minutes: Lightsail key pairs or temporary SSH access, or API Gateway API keys."
name: pacu_service_credential_issuance
status: experimental
correlation:
  type: value_count
  rules:
    - pacu_service_credential_issuance_base
  group-by:
    - principal_arn
  timespan: 30m
  condition:
    field: product_event_type
    gte: 2
level: medium
