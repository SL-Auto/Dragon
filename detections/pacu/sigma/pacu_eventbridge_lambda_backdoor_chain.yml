title: "Detects one principal creating a Lambda function and an EventBridge rule whose event pattern matches IAM or EC2 API events within 30 minutes (PA-DR-04), the event-driven backdoor that reacts to new users, roles or security groups."
name: pacu_eventbridge_lambda_backdoor_chain
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - pacu_eventbridge_lambda_backdoor_chain_first
    - pacu_eventbridge_lambda_backdoor_chain_second
  group-by:
    - principal_arn
  timespan: 30m
level: high
