title: "Detects one principal creating a Lambda function and an EventBridge rule whose event pattern matches IAM or EC2 API events within 30 minutes (PA-DR-04), the event-driven backdoor that reacts to new users, roles or security groups."
name: pacu_eventbridge_lambda_backdoor_chain_second
status: experimental
description: "Detects one principal creating a Lambda function and an EventBridge rule whose event pattern matches IAM or EC2 API events within 30 minutes (PA-DR-04), the event-driven backdoor that reacts to new users, roles or security groups."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type: "PutRule"
    event_pattern|re: "(?i)aws\\.(iam|ec2)"
  condition: sel
falsepositives:
  - "Serverless deployment pipelines (CloudFormation, SAM, CDK) that create functions and rules together; approve their role ARNs."
level: high
