title: "Detects one non-console AWS principal issuing List, Describe or Get calls to fifteen or more distinct services within 30 minutes, the breadth of Pacu's enumeration modules."
name: pacu_multi_service_enumeration_fanout_base
status: experimental
description: "Detects one non-console AWS principal issuing List, Describe or Get calls to fifteen or more distinct services within 30 minutes, the breadth of Pacu's enumeration modules."
source_yaral: "detections/pacu/yaral/pacu_multi_service_enumeration_fanout.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, resource_name); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
procedure_ids: "PA-P02,PA-P11,PA-P16"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; eventSource in target.application."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type|re: "(?i)^(List|Describe|Get)[A-Z]"
  filter0:
    user_agent|re: "(?i)(console\\.amazonaws\\.com|signin\\.amazonaws\\.com|AWS Internal)"
  condition: sel and not filter0
falsepositives:
  - "CSPM, inventory and governance roles."
level: medium
---
title: "Detects one non-console AWS principal issuing List, Describe or Get calls to fifteen or more distinct services within 30 minutes, the breadth of Pacu's enumeration modules."
name: pacu_multi_service_enumeration_fanout
status: experimental
correlation:
  type: value_count
  rules:
    - pacu_multi_service_enumeration_fanout_base
  group-by:
    - principal_arn
  timespan: 30m
  condition:
    field: event_source
    gte: 15
level: medium
