    product_event_type: "GetCredentialReport"
  condition: sel
falsepositives:
  - "Compliance and audit tooling."
level: medium
---
title: "Detects generation and retrieval of the IAM credential report (GenerateCredentialReport followed by GetCredentialReport) by a non-console principal."
name: pacu_credential_report_generation
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - pacu_credential_report_generation_first
    - pacu_credential_report_generation_second
  group-by:
    - principal_arn
  timespan: 30m
level: medium
