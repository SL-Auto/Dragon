title: "Detects one principal assuming the OrganizationAccountAccessRole in two or more member accounts within 1 hour."
name: pacu_organization_member_role_assumption_base
status: experimental
description: "Detects one principal assuming the OrganizationAccountAccessRole in two or more member accounts within 1 hour."
source_yaral: "detections/pacu/yaral/pacu_organization_member_role_assumption.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, resource_name, account_id); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
procedure_ids: "PA-P09"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; the assumed role ARN in target.resource.name and the member account in target.cloud.project.name."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type: "AssumeRole"
    resource_name|re: "(?i):role/OrganizationAccountAccessRole$"
  condition: sel
falsepositives:
  - "Organization administrators and landing-zone automation."
level: high
---
title: "Detects one principal assuming the OrganizationAccountAccessRole in two or more member accounts within 1 hour."
name: pacu_organization_member_role_assumption
status: experimental
correlation:
  type: value_count
  rules:
    - pacu_organization_member_role_assumption_base
  group-by:
    - principal_arn
  timespan: 60m
  condition:
    field: account_id
    gte: 2
level: high
