title: "Detects AWS API calls whose user agent carries Pacu's session suffix (Pacu-Session-<uuid>), appended by the set_ua_suffix command."
name: pacu_user_agent_session_suffix_base
status: experimental
description: "Detects AWS API calls whose user agent carries Pacu's session suffix (Pacu-Session-<uuid>), appended by the set_ua_suffix command."
source_yaral: "detections/pacu/yaral/pacu_user_agent_session_suffix.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, resource_name); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
procedure_ids: "PA-P01"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    user_agent|re: "(?i)Pacu-Session-[0-9a-fA-F-]{36}"
  condition: sel
falsepositives:
  - "Authorized assessments that set the suffix deliberately for deconfliction."
level: high
---
title: "Detects AWS API calls whose user agent carries Pacu's session suffix (Pacu-Session-<uuid>), appended by the set_ua_suffix command."
name: pacu_user_agent_session_suffix
status: experimental
correlation:
  type: event_count
  rules:
    - pacu_user_agent_session_suffix_base
  group-by:
    - principal_arn
  timespan: 60m
  condition:
    gte: 1
level: high
