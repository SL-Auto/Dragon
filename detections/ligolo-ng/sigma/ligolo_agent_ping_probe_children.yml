title: "Detects a non-shell parent process spawning the system ping command with Ligolo-ng's exact single-probe argument shape (Windows: ping /n 1 /w 3000 <target>; other platforms: ping -c 1 -W 3 <target>) against three or more targets. This is the unprivileged fallback of the agent's ICMP host-discovery handler."
name: ligolo_agent_ping_probe_children_base
status: experimental
description: "Detects a non-shell parent process spawning the system ping command with Ligolo-ng's exact single-probe argument shape (Windows: ping /n 1 /w 3000 <target>; other platforms: ping -c 1 -W 3 <target>) against three or more targets. This is the unprivileged fallback of the agent's ICMP host-discovery handler."
source_yaral: "detections/ligolo-ng/yaral/ligolo_agent_ping_probe_children.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, parent_process_id, parent_process_path, command_line); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/ligolo-ng/source-analysis.md#procedure-analysis; reviews/ligolo-ng/detection-review.md"
procedure_ids: "LG-P06"
log_source_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, or EDR, or Linux process execution) with the child command line, the parent image path, host and parent process ID."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
    command_line|re: "(?i)^\"?([a-z]:\\\\[^\"]*\\\\)?ping(\\.exe)?\"?\\s+/n\\s+1\\s+/w\\s+3000\\s+\\S+\\s*$|^(\\S*/)?ping\\s+-c\\s+1\\s+-W\\s+3\\s+\\S+\\s*$"
  filter0:
    parent_process_path|re: "(?i)(\\\\(cmd|powershell|pwsh|wscript|cscript)\\.exe|/(ba|z|da|k|c|tc|fi)?sh)$"
  condition: sel and not filter0
falsepositives:
  - "Monitoring agents or custom services that shell out to ping with the same single-probe arguments; approve their parent images after validation."
level: high
---
title: "Detects a non-shell parent process spawning the system ping command with Ligolo-ng's exact single-probe argument shape (Windows: ping /n 1 /w 3000 <target>; other platforms: ping -c 1 -W 3 <target>) against three or more targets. This is the unprivileged fallback of the agent's ICMP host-discovery handler."
name: ligolo_agent_ping_probe_children
status: experimental
correlation:
  type: value_count
  rules:
    - ligolo_agent_ping_probe_children_base
  group-by:
    - hostname
    - parent_process_id
  timespan: 10m
  condition:
    field: command_line
    gte: 3
level: high
