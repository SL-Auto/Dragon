title: "Detects one unverified process connecting to many distinct internal hosts on administrative service ports within 10 minutes, without requiring a visible tunnel leg. It compensates for pivots whose upstream is an internal proxy, a chained agent or an inbound session that the parser cannot orient."
name: ligolo_process_internal_admin_port_sweep_base
status: experimental
description: "Detects one unverified process connecting to many distinct internal hosts on administrative service ports within 10 minutes, without requiring a visible tunnel leg. It compensates for pivots whose upstream is an internal proxy, a chained agent or an inbound session that the parser cannot orient."
source_yaral: "detections/ligolo-ng/yaral/ligolo_process_internal_admin_port_sweep.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, direction, hostname, process_id, process_path, target_ip, target_port, process_signed); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/ligolo-ng/source-analysis.md#procedure-analysis; public-rules/comparisons/ligolo-ng/ligolo_tunnel_process_internal_fanout.md; reviews/ligolo-ng/detection-review.md#lg-dr-10"
procedure_ids: "LG-P02,LG-P04"
log_source_prerequisites: "Process-attributed OUTBOUND NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with destination IP and port, host and stable process ID; optional signature verification status."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type: "NETWORK_CONNECTION"
    direction: "OUTBOUND"
    target_port:
      - "21"
      - "22"
      - "23"
      - "135"
      - "139"
      - "445"
      - "3389"
      - "5985"
      - "5986"
    target_ip|re: "(?i)^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|f[cd][0-9a-f]{2}:)"
  filter0:
    process_signed: true
  condition: sel and not filter0
falsepositives:
  - "Unapproved or unsigned inventory, vulnerability and monitoring scanners and custom administration scripts; approve scanner images and hosts."
level: medium
---
title: "Detects one unverified process connecting to many distinct internal hosts on administrative service ports within 10 minutes, without requiring a visible tunnel leg. It compensates for pivots whose upstream is an internal proxy, a chained agent or an inbound session that the parser cannot orient."
name: ligolo_process_internal_admin_port_sweep
status: experimental
correlation:
  type: value_count
  rules:
    - ligolo_process_internal_admin_port_sweep_base
  group-by:
    - hostname
    - process_id
  timespan: 10m
  condition:
    field: target_ip
    gte: 30
level: medium
