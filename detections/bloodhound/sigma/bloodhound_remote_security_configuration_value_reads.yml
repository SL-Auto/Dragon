title: "Detects one account reading two or more collector-relevant security-configuration registry values (KDC certificate binding, Schannel certificate mapping, LSA/MSV1_0 NTLM restriction and compatibility values, or CA security/enrollment-agent/edit-flag values) on a single target, compensating for single-target reads below bloodhound_remote_security_configuration_reads's multi-host threshold."
name: bloodhound_remote_security_configuration_value_reads_base
status: experimental
description: "Detects one account reading two or more collector-relevant security-configuration registry values (KDC certificate binding, Schannel certificate mapping, LSA/MSV1_0 NTLM restriction and compatibility values, or CA security/enrollment-agent/edit-flag values) on a single target, compensating for single-target reads below bloodhound_remote_security_configuration_reads's multi-host threshold."
source_yaral: "detections/bloodhound/yaral/bloodhound_remote_security_configuration_value_reads.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "target.hostname->dest/DeviceName/hostname/host.name; principal.user.userid->user/InitiatingProcessAccountName/user_id/user.name; target.registry.registry_key->registry_path/RegistryKey/registry_key/registry.path; target.registry.registry_value_name->registry_value_name/RegistryValueName/registry_value/registry.value; principal.process.file.full_path->process_path/InitiatingProcessFolderPath/process.executable"
assumptions_and_gaps: "Base rule expresses key/value pairs and exclusions; value_count correlation expresses >=2 distinct values per user and host. Requires a value-level registry read source and Sigma correlation support."
references:
  - "reports/bloodhound/source-analysis.md#bh-012, sources/bloodhound-ce-src packages/go/ein/ad.go#L121-L146 (5e8e78e), public-rules/comparisons/bloodhound/bloodhound_remote_security_configuration_reads.md, reviews/bloodhound/detection-review.md#bh-dr-20"
procedure_ids: "BH-012"
log_source_prerequisites: "EDR REGISTRY_READ telemetry exposing full registry key path, value name, subject account, reading process path and target host. Windows Security 4656/4663 record the key and access mask but not the value name, so they cannot satisfy this rule (reviews/bloodhound/detection-review.md#bh-dr-25)."
logsource:
  category: registry_event
  product: windows
detection:
  value_kdc:
    TargetObject|endswith: '\Services\Kdc\StrongCertificateBindingEnforcement'
  value_schannel:
    TargetObject|endswith: '\SecurityProviders\Schannel\CertificateMappingMethods'
  value_lsa:
    TargetObject|re: '(?i)\\Control\\Lsa(\\MSV1_0)?\\(RestrictSendingNtlmTraffic|RestrictReceivingNTLMTraffic|NtlmMinClientSec|NtlmMinServerSec|LmCompatibilityLevel|UseMachineId|ClientAllowedNTLMServers)$'
  value_ca:
    TargetObject|re: '(?i)\\CertSvc\\Configuration\\.*\\(Security|EnrollmentAgentRights|EditFlags)$'
  selection_read:
    EventType: REGISTRY_READ
  filter_owner:
    Image|endswith:
      - '\lsass.exe'
      - '\certsrv.exe'
      - '\services.exe'
      - '\wininit.exe'
      - '\csrss.exe'
  filter_local_service:
    User:
      - 'SYSTEM'
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'
      - 'S-1-5-18'
      - 'S-1-5-19'
      - 'S-1-5-20'
  condition: selection_read and 1 of value_* and not 1 of filter_*
falsepositives:
  - "Security posture assessment, PKI administration, vulnerability management and domain-controller compliance tooling reading several of these values on one host; administrators inspecting values with regedit or reg.exe."
level: high
---
title: "Detects one account reading two or more collector-relevant security-configuration registry values (KDC certificate binding, Schannel certificate mapping, LSA/MSV1_0 NTLM restriction and compatibility values, or CA security/enrollment-agent/edit-flag values) on a single target, compensating for single-target reads below bloodhound_remote_security_configuration_reads's multi-host threshold."
name: bloodhound_remote_security_configuration_value_reads
status: experimental
correlation:
  type: value_count
  rules:
    - bloodhound_remote_security_configuration_value_reads_base
  group-by:
    - User
    - Computer
  timespan: 30m
  condition:
    field: TargetObject
    gte: 2
level: high
