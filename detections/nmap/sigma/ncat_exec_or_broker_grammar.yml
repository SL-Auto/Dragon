title: "Detects a process started with Ncat command-execution or relay grammar regardless of the executable name: --sh-exec, --lua-exec, --broker, --chat or --keep-open; or -e/--exec/-c combined with listen mode (-l with only n, v, k or p companions) and a port argument (NM-DR-05)."
name: ncat_exec_or_broker_grammar_base
status: experimental
description: "Detects a process started with Ncat command-execution or relay grammar regardless of the executable name: --sh-exec, --lua-exec, --broker, --chat or --keep-open; or -e/--exec/-c combined with listen mode (-l with only n, v, k or p companions) and a port argument (NM-DR-05)."
source_yaral: "detections/nmap/yaral/ncat_exec_or_broker_grammar.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_path, command_line); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/nmap/source-analysis.md#procedure-analysis; reviews/nmap/detection-review.md"
procedure_ids: "NM-P15"
log_source_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, Linux auditd EXECVE or EDR) with the full command line, image path and host."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
  alt0_0:
    command_line|re: "(?i)(^|\\s)--(sh-exec|lua-exec|broker|chat|keep-open)(\\s|=|$)"
  alt0_1:
    command_line|re: "(?i)(^|\\s)(-e|--exec|-c)(\\s|=)\\S+"
    command_line|re: "(?i)(^|\\s)(-[nvk]*l[nvkp]*|--listen)(\\s|$)"
    command_line|re: "(?i)\\s\\d{2,5}(\\s|$)"
  condition: sel and 1 of alt0_*
falsepositives:
  - "Administrators using Ncat for authorized troubleshooting."
level: high
---
title: "Detects a process started with Ncat command-execution or relay grammar regardless of the executable name: --sh-exec, --lua-exec, --broker, --chat or --keep-open; or -e/--exec/-c combined with listen mode (-l with only n, v, k or p companions) and a port argument (NM-DR-05)."
name: ncat_exec_or_broker_grammar
status: experimental
correlation:
  type: event_count
  rules:
    - ncat_exec_or_broker_grammar_base
  group-by:
    - hostname
    - process_path
  timespan: 60m
  condition:
    gte: 1
level: high
