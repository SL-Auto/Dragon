title: "Detects a process started with Nmap or Nping option grammar regardless of the executable name: an Nmap scan-type flag (-sS, -sT, -sU, -sV, -sC and similar) together with a port, discovery, script, output or timing option; or Nping's distinctive long options."
name: nmap_cli_option_grammar_base
status: experimental
description: "Detects a process started with Nmap or Nping option grammar regardless of the executable name: an Nmap scan-type flag (-sS, -sT, -sU, -sV, -sC and similar) together with a port, discovery, script, output or timing option; or Nping's distinctive long options."
source_yaral: "detections/nmap/yaral/nmap_cli_option_grammar.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_path, command_line); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/nmap/source-analysis.md#procedure-analysis; reviews/nmap/detection-review.md"
procedure_ids: "NM-P01,NM-P02,NM-P03,NM-P04,NM-P05,NM-P06,NM-P07,NM-P08,NM-P09,NM-P10,NM-P11,NM-P12,NM-P13,NM-P16"
log_source_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, Linux auditd EXECVE or EDR) with the full command line, image path and host."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
  alt0_0:
    command_line|re: "(?i)(^|\\s)-s[STUVACNFXWMOYZIL]{1,2}(\\s|$)"
    command_line|re: "(?i)(^|\\s)(-p\\s*[0-9TU:,-]+|-p-|-Pn|-P[SAUYEPM][0-9,]*|-O(\\s|$)|-A(\\s|$)|-T[0-5](\\s|$)|--top-ports|--script(\\s|=)|-o[ANXGS](\\s|$)|--min-rate|--max-retries|--open(\\s|$))"
  alt0_1:
    command_line|re: "(?i)(^|\\s)--(script|script-args)(\\s|=)\\S*(vuln|exploit|brute|auth|intrusive|dos|broadcast|discovery|default|safe|[a-z0-9-]+\\.nse)"
  alt0_2:
    command_line|re: "(?i)(^|\\s)--(echo-server|echo-client|icmp-type|tcp-connect|arp-type)(\\s|=)"
  condition: sel and 1 of alt0_*
falsepositives:
  - "Authorized network administrators, vulnerability-management scanners and IT asset discovery running Nmap; approve by host and account."
level: high
---
title: "Detects a process started with Nmap or Nping option grammar regardless of the executable name: an Nmap scan-type flag (-sS, -sT, -sU, -sV, -sC and similar) together with a port, discovery, script, output or timing option; or Nping's distinctive long options."
name: nmap_cli_option_grammar
status: experimental
correlation:
  type: event_count
  rules:
    - nmap_cli_option_grammar_base
  group-by:
    - hostname
    - process_path
  timespan: 60m
  condition:
    gte: 1
level: high
