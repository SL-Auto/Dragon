title: "Detects one non-system process sending to four or more distinct local discovery protocols (LLMNR 5355, mDNS 5353, SSDP 1900, NBNS 137, DHCP 67, WS-Discovery 3702, SLP 427) within 2 minutes, the pattern of NSE broadcast scripts."
name: nmap_broadcast_discovery_ports_base
status: experimental
description: "Detects one non-system process sending to four or more distinct local discovery protocols (LLMNR 5355, mDNS 5353, SSDP 1900, NBNS 137, DHCP 67, WS-Discovery 3702, SLP 427) within 2 minutes, the pattern of NSE broadcast scripts."
source_yaral: "detections/nmap/yaral/nmap_broadcast_discovery_ports.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_id, process_path, target_port); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/nmap/source-analysis.md#procedure-analysis; reviews/nmap/detection-review.md"
procedure_ids: "NM-P11"
log_source_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with destination IP and port, host and stable process ID; optional signature verification status. UDP to multicast or broadcast destinations must be logged."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type: "NETWORK_CONNECTION"
    target_port:
      - "5355"
      - "5353"
      - "1900"
      - "137"
      - "67"
      - "3702"
      - "427"
  filter0:
    process_path|re: "(?i)\\\\windows\\\\system32\\\\(svchost|lsass|services|dashost)\\.exe$"
  condition: sel and not filter0
falsepositives:
  - "Media and device-discovery applications and network inventory tools."
level: medium
---
title: "Detects one non-system process sending to four or more distinct local discovery protocols (LLMNR 5355, mDNS 5353, SSDP 1900, NBNS 137, DHCP 67, WS-Discovery 3702, SLP 427) within 2 minutes, the pattern of NSE broadcast scripts."
name: nmap_broadcast_discovery_ports
status: experimental
correlation:
  type: value_count
  rules:
    - nmap_broadcast_discovery_ports_base
  group-by:
    - hostname
    - process_id
  timespan: 2m
  condition:
    field: target_port
    gte: 4
level: medium
