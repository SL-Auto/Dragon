title: "Detects execution of the Nmap binary identified by its PE OriginalFileName (nmap.exe), which survives renaming on Windows, or by an image named nmap on other platforms. It covers default invocations such as nmap <target> that carry no option grammar."
name: nmap_binary_identity_execution_base
status: experimental
description: "Detects execution of the Nmap binary identified by its PE OriginalFileName (nmap.exe), which survives renaming on Windows, or by an image named nmap on other platforms. It covers default invocations such as nmap <target> that carry no option grammar."
source_yaral: "detections/nmap/yaral/nmap_binary_identity_execution.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_path, command_line, original_file_name); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/nmap/source-analysis.md#procedure-analysis; public-rules/comparisons/nmap/nmap_cli_option_grammar.md; reviews/nmap/detection-review.md#nm-dr-08"
procedure_ids: "NM-P01,NM-P02,NM-P03,NM-P05,NM-P06,NM-P07,NM-P08"
log_source_prerequisites: "PROCESS_LAUNCH telemetry with image path and PE OriginalFileName (Sysmon Event ID 1 OriginalFileName mapped to target.process.file.pe_file.original_file_name, or EDR equivalent)."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
  alt0_0:
    original_file_name|re: "(?i)^nmap\\.exe$"
  alt0_1:
    process_path|re: "(?i)(\\\\nmap\\.exe|/nmap)$"
  condition: sel and 1 of alt0_*
falsepositives:
  - "Authorized administrators and vulnerability-management hosts running Nmap; approve by host."
level: medium
---
title: "Detects execution of the Nmap binary identified by its PE OriginalFileName (nmap.exe), which survives renaming on Windows, or by an image named nmap on other platforms. It covers default invocations such as nmap <target> that carry no option grammar."
name: nmap_binary_identity_execution
status: experimental
correlation:
  type: event_count
  rules:
    - nmap_binary_identity_execution_base
  group-by:
    - hostname
    - process_path
  timespan: 60m
  condition:
    gte: 1
level: medium
