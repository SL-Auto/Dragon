title: "Detects creation of a grepable Nmap output file (.gnmap), produced by -oG or alongside .nmap and .xml by -oA."
name: nmap_output_file_artifacts
status: experimental
correlation:
  type: event_count
  rules:
    - nmap_output_file_artifacts_base
  group-by:
    - hostname
  timespan: 60m
  condition:
    gte: 1
