title: "Detects one source IP producing authentication failures for ten or more distinct accounts, or against five or more hosts, within 10 minutes, the target-side effect of NSE brute-force and default-credential scripts."
name: nmap_auth_failure_fanout_from_source_base
status: experimental
description: "Detects one source IP producing authentication failures for ten or more distinct accounts, or against five or more hosts, within 10 minutes, the target-side effect of NSE brute-force and default-credential scripts."
source_yaral: "detections/nmap/yaral/nmap_auth_failure_fanout_from_source.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, product_event_type, source_ip, target_user, target_host, action); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/nmap/source-analysis.md#procedure-analysis; reviews/nmap/detection-review.md"
procedure_ids: "NM-P09"
log_source_prerequisites: "Windows Security 4625 and 4771 (and service authentication failures normalized as USER_LOGIN with security_result.action BLOCK) with source IP, target account and target host."
logsource:
  service: security
  product: windows
detection:
  alt0_0:
    product_event_type:
      - "4625"
      - "4771"
  alt0_1:
    event_type: "USER_LOGIN"
    action: "BLOCK"
  condition: 1 of alt0_*
falsepositives:
  - "Misconfigured services retrying stale credentials, password-audit tools and shared NAT sources."
level: medium
---
title: "Detects one source IP producing authentication failures for ten or more distinct accounts, or against five or more hosts, within 10 minutes, the target-side effect of NSE brute-force and default-credential scripts."
name: nmap_auth_failure_fanout_from_source
status: experimental
correlation:
  type: value_count
  rules:
    - nmap_auth_failure_fanout_from_source_base
  group-by:
    - source_ip
  timespan: 10m
  condition:
    field: target_user
    gte: 10
level: medium
