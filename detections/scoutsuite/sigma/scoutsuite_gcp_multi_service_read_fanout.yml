title: "Detects one GCP principal issuing list, get, search or getIamPolicy calls to ten or more distinct GCP services within 30 minutes."
name: scoutsuite_gcp_multi_service_read_fanout_base
status: experimental
description: "Detects one GCP principal issuing list, get, search or getIamPolicy calls to ten or more distinct GCP services within 30 minutes."
source_yaral: "detections/scoutsuite/yaral/scoutsuite_gcp_multi_service_read_fanout.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, principal_email, service_name); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/scoutsuite/source-analysis.md#procedure-analysis; reviews/scoutsuite/detection-review.md"
procedure_ids: "SS-P03"
log_source_prerequisites: "GCP Cloud Audit Logs Data Access with methodName in metadata.product_event_type, serviceName in target.application and principalEmail in principal.user.email_addresses."
logsource:
  category: gcp_audit
  product: gcp
detection:
  sel:
    product_event_type|re: "(?i)\\.(List|Get|Search|Aggregated|GetIamPolicy)[A-Za-z]*$|\\.(list|get|search|aggregatedList|getIamPolicy)$"
  condition: sel
falsepositives:
  - "Security Command Center, CSPM and inventory service accounts."
level: medium
---
title: "Detects one GCP principal issuing list, get, search or getIamPolicy calls to ten or more distinct GCP services within 30 minutes."
name: scoutsuite_gcp_multi_service_read_fanout
status: experimental
correlation:
  type: value_count
  rules:
    - scoutsuite_gcp_multi_service_read_fanout_base
  group-by:
    - principal_email
  timespan: 30m
  condition:
    field: service_name
    gte: 10
level: medium
