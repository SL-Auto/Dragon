title: "Detects one non-console AWS principal issuing List, Describe or Get calls to twenty or more distinct services within 30 minutes, the breadth of a full ScoutSuite AWS audit."
name: scoutsuite_aws_multi_service_read_fanout_base
status: experimental
description: "Detects one non-console AWS principal issuing List, Describe or Get calls to twenty or more distinct services within 30 minutes, the breadth of a full ScoutSuite AWS audit."
source_yaral: "detections/scoutsuite/yaral/scoutsuite_aws_multi_service_read_fanout.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, principal_arn, event_source, user_agent); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/scoutsuite/source-analysis.md#procedure-analysis; reviews/scoutsuite/detection-review.md"
procedure_ids: "SS-P01"
log_source_prerequisites: "AWS CloudTrail read events with eventSource in target.application and userAgent in network.http.user_agent."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_event_type|re: "(?i)^(List|Describe|Get)[A-Z]"
  filter0:
    user_agent|re: "(?i)(console\\.amazonaws\\.com|signin\\.amazonaws\\.com|AWS Internal)"
  condition: sel and not filter0
falsepositives:
  - "CSPM, inventory and governance roles."
level: medium
---
title: "Detects one non-console AWS principal issuing List, Describe or Get calls to twenty or more distinct services within 30 minutes, the breadth of a full ScoutSuite AWS audit."
name: scoutsuite_aws_multi_service_read_fanout
status: experimental
correlation:
  type: value_count
  rules:
    - scoutsuite_aws_multi_service_read_fanout_base
  group-by:
    - principal_arn
  timespan: 30m
  condition:
    field: event_source
    gte: 20
level: medium
