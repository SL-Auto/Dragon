title: "Correlates NTLM authentication (4624/4776) with a privileged target-side effect (service install, account/group change, or AD authorization change) by the same account on the same host, requiring the target-side effect that the base cross-source relay rule does not."
name: impacket_ntlm_relay_with_privileged_effect
status: experimental
correlation:
  type: temporal_ordered
  rules:
    - impacket_ntlm_relay_with_privileged_effect_first
    - impacket_ntlm_relay_with_privileged_effect_second
  group-by:
    - target_host
    - acting_user
  timespan: 5m
  aliases:
    acting_user:
      impacket_ntlm_relay_with_privileged_effect_first: target_user
      impacket_ntlm_relay_with_privileged_effect_second: user_id
level: critical
