title: "Detects a Terminal Services session connect, disconnect, reconnect or logoff control action performed by a principal different from the session's own target user, consistent with remote session hijack or tscon-style session takeover."
name: impacket_terminal_services_session_control_by_other_actor_base
status: experimental
description: "Detects a Terminal Services session connect, disconnect, reconnect or logoff control action performed by a principal different from the session's own target user, consistent with remote session hijack or tscon-style session takeover."
source_yaral: "detections/impacket/yaral/impacket_terminal_services_session_control_by_other_actor.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, hostname, user_id, target_user); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. The canonical field-to-field inequality (acting user differs from session owner) is expressed natively in SPL/KQL/SQL below; Sigma cannot compare two fields and EQL cannot aggregate."
references:
  - "reports/impacket/source-analysis.md"
procedure_ids: "IMP-18"
log_source_prerequisites: "Terminal Services Operational and Security session events (4778/4779/23/24/25) with both a populated principal (acting) and target (session-owning) user identity."
logsource:
  service: terminalservices-localsessionmanager
  product: windows
detection:
  sel:
    product_event_type:
      - "4778"
      - "4779"
      - "23"
      - "24"
      - "25"
  condition: sel
falsepositives:
  - "Helpdesk-initiated session shadowing/takeover, session broker or load-balancer service accounts, and RDS farm reconnection performed under a management service identity."
level: high
---
title: "Detects a Terminal Services session connect, disconnect, reconnect or logoff control action performed by a principal different from the session's own target user, consistent with remote session hijack or tscon-style session takeover."
name: impacket_terminal_services_session_control_by_other_actor
status: experimental
correlation:
  type: event_count
  rules:
    - impacket_terminal_services_session_control_by_other_actor_base
  group-by:
    - hostname
  timespan: 10m
  condition:
    gte: 1
level: high
