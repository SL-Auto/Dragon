title: "Detects a successful Kerberos encoded-ticket retrieval call through LsaCallAuthenticationPackage, separated from lower-confidence cache enumeration/query activity."
name: rubeus_lsa_encoded_ticket_retrieval_base
status: experimental
description: "Detects a successful Kerberos encoded-ticket retrieval call through LsaCallAuthenticationPackage, separated from lower-confidence cache enumeration/query activity."
source_yaral: "detections/rubeus/yaral/rubeus_lsa_encoded_ticket_retrieval.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, hostname, process_id, process_path, api_name, kerberos_message_type, result, target_luid); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md; public-rules/comparisons/rubeus/rubeus_lsa_ticket_cache_operations.md"
procedure_ids: "PROC-006"
log_source_prerequisites: "EDR must expose LsaCallAuthenticationPackage API calls with Kerberos message type and a success/failure result; process, user, host, and target LUID are required for triage."
logsource:
  category: api_call
  product: windows
detection:
  sel:
    product_event_type: "EDR_API_CALL"
    api_name: "LsaCallAuthenticationPackage"
    kerberos_message_type|re: "(?i)^Kerb(RetrieveEncodedTicket|RetrieveTicket)(Message)?$"
    result: "ALLOW"
  condition: sel
falsepositives:
  - "Klist, SSO components, credential-isolation and IR tooling that legitimately retrieve encoded tickets."
level: high
---
title: "Detects a successful Kerberos encoded-ticket retrieval call through LsaCallAuthenticationPackage, separated from lower-confidence cache enumeration/query activity."
name: rubeus_lsa_encoded_ticket_retrieval
status: experimental
correlation:
  type: event_count
  rules:
    - rubeus_lsa_encoded_ticket_retrieval_base
  group-by:
    - hostname
    - process_id
  timespan: 10m
  condition:
    gte: 1
level: high
