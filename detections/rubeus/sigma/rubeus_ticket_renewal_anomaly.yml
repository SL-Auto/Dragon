title: "Detects a burst of Kerberos ticket renewals (4770) by one source and identity, a scripted or looping renewal anomaly separated from service-ticket (4769) acquisition volume. It does not identify low-rate automatic renewal, which is indistinguishable from native LSA renewal."
name: rubeus_ticket_renewal_anomaly
status: experimental
correlation:
  type: event_count
  rules:
    - rubeus_ticket_renewal_anomaly_base
  group-by:
    - source_ip
    - user_id
  timespan: 10m
  condition:
    gte: 15
level: low
