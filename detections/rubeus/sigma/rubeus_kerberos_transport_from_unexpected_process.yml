title: "Detects a Windows process other than lsass.exe connecting to a Kerberos KDC (port 88) or the Kerberos password-change service (port 464). This is the client-side network effect of ticket requests, roasting, delegation abuse or password change performed by a tool that implements its own Kerberos transport instead of using the LSA."
name: rubeus_kerberos_transport_from_unexpected_process_base
status: experimental
description: "Detects a Windows process other than lsass.exe connecting to a Kerberos KDC (port 88) or the Kerberos password-change service (port 464). This is the client-side network effect of ticket requests, roasting, delegation abuse or password change performed by a tool that implements its own Kerberos transport instead of using the LSA."
source_yaral: "detections/rubeus/yaral/rubeus_kerberos_transport_from_unexpected_process.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_path, target_ip, target_port, user_id); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md; public-rules/comparisons/rubeus/rubeus_unusual_kerberos_password_change.md; public-rules/comparisons/rubeus/rubeus_kerberoast_sequence.md; reviews/rubeus/detection-review.md#review-015"
procedure_ids: "PROC-001,PROC-002,PROC-003,PROC-004,PROC-005,PROC-012"
log_source_prerequisites: "Process-attributed network-connection telemetry (Sysmon Event ID 3 or EDR equivalent, NETWORK_CONNECTION) with destination port, host and initiating process image path. Windows hosts are identified by a drive-letter image path."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type: "NETWORK_CONNECTION"
    process_path|re: "(?i)^[a-z]:\\\\"
  alt0_0:
    target_port: 88
  alt0_1:
    target_port: 464
  filter0:
    process_path|re: "(?i)^[a-z]:\\\\windows\\\\system32\\\\lsass\\.exe$"
  condition: sel and 1 of alt0_* and not filter0
falsepositives:
  - "Java and other cross-platform applications with their own Kerberos stack, MIT Kerberos for Windows, identity-synchronization and password-management agents, and authorized security assessment tools; approve them by image path and signer after validation. Domain controllers should be scoped separately if their KDC-to-KDC traffic is attributed to processes other than lsass.exe."
level: high
---
title: "Detects a Windows process other than lsass.exe connecting to a Kerberos KDC (port 88) or the Kerberos password-change service (port 464). This is the client-side network effect of ticket requests, roasting, delegation abuse or password change performed by a tool that implements its own Kerberos transport instead of using the LSA."
name: rubeus_kerberos_transport_from_unexpected_process
status: experimental
correlation:
  type: event_count
  rules:
    - rubeus_kerberos_transport_from_unexpected_process_base
  group-by:
