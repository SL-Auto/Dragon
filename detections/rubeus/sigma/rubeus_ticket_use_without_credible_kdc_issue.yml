title: "Detects Kerberos service use without a corresponding ticket issue, DC-health gated."
name: rubeus_ticket_use_without_credible_kdc_issue
status: experimental
description: "Detects anomalous Kerberos-authenticated service use without a corresponding observed service-ticket issue, gated on an explicit domain-controller collection-health signal."
source_yaral: "detections/rubeus/yaral/rubeus_ticket_use_without_credible_kdc_issue.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
assumptions_and_gaps: "Candidate retrieval is translated; canonical entity joins, ordering, windows, and cardinality must be implemented and tested in the target backend. Plain Sigma cannot express the cross-event absence check or the collection-health gate; a correlation rule (type: temporal with a negated sub-rule) plus a health-event existence check is required."
references:
  - "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md"
  - "public-rules/comparisons/rubeus/rubeus_ticket_use_without_credible_kdc_issue.md"
procedure_ids: "PROC-008,PROC-009"
log_source_prerequisites: "Centralize complete 4769 telemetry and resource-side Kerberos service-use/PAC anomaly data with normalized user, source, and service, plus a collection-health event proving all authoritative domain controllers reported for the window."
logsource:
  category: generic
detection:
  selection_event_type:
    event.code: ["4769", "USER_LOGIN"]
  filter_health:
    all_domain_controllers_reporting: true
  condition: selection_event_type and filter_health
falsepositives:
  - "Missing DC logs, cached tickets, referrals, cross-realm activity, and parser mismatches; the collection-health gate mitigates but does not eliminate these."
level: high
