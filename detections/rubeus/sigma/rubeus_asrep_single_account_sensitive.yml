title: "Detects a successful AS request without pre-authentication data for an account the tenant has classified as high-risk, compensating for targeted single-account AS-REP roasting below the three-account threshold of rubeus_asrep_roast_sequence."
name: rubeus_asrep_single_account_sensitive
status: experimental
correlation:
  type: event_count
  rules:
    - rubeus_asrep_single_account_sensitive_base
  group-by:
    - source_ip
    - user_id
  timespan: 60m
  condition:
    gte: 1
level: high
