title: "Detects unusual service-ticket (4769) acquisition volume by one source and identity."
name: rubeus_service_ticket_or_renewal_anomaly
status: experimental
description: "Detects unusual service-ticket (4769) acquisition volume by one source and identity. Split from ticket renewal, which is a separately scored signal covered by rubeus_ticket_renewal_anomaly, and complemented by the ticket-property-specific rubeus_rc4_service_ticket_fanout."
source_yaral: "detections/rubeus/yaral/rubeus_service_ticket_or_renewal_anomaly.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
assumptions_and_gaps: "Candidate retrieval is translated; canonical entity joins, ordering, windows, and cardinality must be implemented and tested in the target backend. Plain Sigma cannot express the event-count/distinct-service-count threshold without a correlation rule. Renewal (4770) and the RC4-specific branch were split out of this rule's scope on 2026-08-16; deploy alongside rubeus_ticket_renewal_anomaly and rubeus_rc4_service_ticket_fanout."
references:
  - "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md"
  - "public-rules/comparisons/rubeus/rubeus_service_ticket_or_renewal_anomaly.md"
procedure_ids: "PROC-002"
log_source_prerequisites: "Normalize DC Security 4769 with account, source IP, service, result, and encryption type."
logsource:
  category: generic
detection:
  selection_event_type:
    event.code: ["4769"]
  condition: selection_event_type
falsepositives:
  - "SSO, service accounts, application servers, and scanners generating broad service-ticket fan-out."
level: medium
