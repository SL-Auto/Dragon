title: "Detects an unverified process making five or more outbound connections to the same destination across four or more distinct minutes within 1 hour, the polling of an HTTP(S) or TCP agent transport."
name: adaptix_recurrent_process_egress
status: experimental
correlation:
  type: event_count
  rules:
    - adaptix_recurrent_process_egress_base
  group-by:
    - hostname
    - process_id
    - target_ip
  timespan: 60m
  condition:
    gte: 5
level: medium
