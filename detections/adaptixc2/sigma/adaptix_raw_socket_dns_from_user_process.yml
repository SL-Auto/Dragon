title: "Detects a user-mode process other than the Windows DNS Client sending recurrent UDP/53 traffic directly to a resolver (six or more connections across four or more minutes within 30 minutes). This is the raw-socket DNS transport, which bypasses the DNS Client service and Sysmon DNS query logging."
name: adaptix_raw_socket_dns_from_user_process_base
status: experimental
description: "Detects a user-mode process other than the Windows DNS Client sending recurrent UDP/53 traffic directly to a resolver (six or more connections across four or more minutes within 30 minutes). This is the raw-socket DNS transport, which bypasses the DNS Client service and Sysmon DNS query logging."
source_yaral: "detections/adaptixc2/yaral/adaptix_raw_socket_dns_from_user_process.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: partial
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, direction, hostname, process_id, process_path, target_ip, target_port, ip_protocol, process_signed); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/adaptixc2/source-analysis.md#procedure-analysis; reviews/adaptixc2/detection-review.md"
procedure_ids: "AX-P02"
log_source_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with direction, protocol, destination IP and port, host and stable process ID; optional signature verification status. UDP must be logged."
logsource:
  category: network_connection
  product: windows
detection:
  sel:
    event_type: "NETWORK_CONNECTION"
    target_port: 53
    ip_protocol: "UDP"
  filter0:
    process_path|re: "(?i)\\\\windows\\\\system32\\\\(svchost|dns|lsass)\\.exe$"
  filter1:
    process_signed: true
  condition: sel and not filter0 and not filter1
falsepositives:
  - "Security agents, VPN clients and browsers with built-in DNS-over-UDP resolvers; approve by signer."
level: high
---
title: "Detects a user-mode process other than the Windows DNS Client sending recurrent UDP/53 traffic directly to a resolver (six or more connections across four or more minutes within 30 minutes). This is the raw-socket DNS transport, which bypasses the DNS Client service and Sysmon DNS query logging."
name: adaptix_raw_socket_dns_from_user_process
status: experimental
correlation:
  type: event_count
  rules:
    - adaptix_raw_socket_dns_from_user_process_base
  group-by:
    - hostname
    - process_id
  timespan: 30m
  condition:
    gte: 6
level: high
