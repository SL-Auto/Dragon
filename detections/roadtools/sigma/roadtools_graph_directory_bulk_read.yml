title: "Detects one identity issuing five hundred or more Microsoft Graph requests to directory endpoints (users, groups, devices, applications, servicePrincipals, directoryRoles, roleManagement, policies) within 10 minutes."
name: roadtools_graph_directory_bulk_read
status: experimental
correlation:
  type: event_count
  rules:
    - roadtools_graph_directory_bulk_read_base
  group-by:
