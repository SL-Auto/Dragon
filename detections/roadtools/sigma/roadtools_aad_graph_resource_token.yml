title: "Detects user sign-ins that obtain tokens for the legacy Azure AD Graph resource (00000002-0000-0000-c000-000000000000), which ROADrecon uses for its directory dump."
name: roadtools_aad_graph_resource_token
status: experimental
correlation:
  type: event_count
  rules:
    - roadtools_aad_graph_resource_token_base
  group-by:
    - user_id
  timespan: 60m
  condition:
    gte: 1
level: medium
