title: "Detects device registration or join of a device named DESKTOP- followed by seven upper-case alphanumerics where the registration was not performed by device-management enrollment (Intune or Autopilot)."
name: roadtools_registered_device_default_name_base
status: experimental
description: "Detects device registration or join of a device named DESKTOP- followed by seven upper-case alphanumerics where the registration was not performed by device-management enrollment (Intune or Autopilot)."
source_yaral: "detections/roadtools/yaral/roadtools_registered_device_default_name.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, user_id, source_ip, user_agent, app_id, resource_id, auth_protocol, incoming_token_type, result_type, device_name, initiated_by_app); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
procedure_ids: "RT-P03"
log_source_prerequisites: "Entra ID audit logs (AuditLogs) normalized with activityDisplayName in metadata.product_event_type, initiating user in principal.user.userid, target user or device in target.user.userid or target.resource.name, and modified-property values in additional.fields['modifiedProperties']; enrollment service in additional.fields['initiatedByApp']."
logsource:
  category: azure_audit
  product: azure
detection:
  sel:
    product_event_type:
      - "Register device"
      - "Add device"
    device_name|re: "(?i)^DESKTOP-[A-Z0-9]{7}$"
  filter0:
    initiated_by_app|re: "(?i)(intune|autopilot|device management)"
  condition: sel and not filter0
falsepositives:
  - "New Windows devices registered outside Intune or Autopilot."
level: low
---
title: "Detects device registration or join of a device named DESKTOP- followed by seven upper-case alphanumerics where the registration was not performed by device-management enrollment (Intune or Autopilot)."
name: roadtools_registered_device_default_name
status: experimental
correlation:
  type: event_count
  rules:
    - roadtools_registered_device_default_name_base
  group-by:
    - user_id
  timespan: 60m
  condition:
    gte: 1
level: low
