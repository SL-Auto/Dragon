title: "Detects one user obtaining tokens for four or more distinct client applications through non-interactive refresh-token sign-ins within 30 minutes, the family-of-client-IDs pivot used to expand token scope."
name: roadtools_foci_refresh_token_client_hopping
status: experimental
correlation:
  type: value_count
  rules:
    - roadtools_foci_refresh_token_client_hopping_base
  group-by:
    - user_id
    - source_ip
  timespan: 30m
  condition:
    field: app_id
    gte: 4
level: high
