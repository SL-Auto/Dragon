title: "Detects PowerShell script blocks that request Windows Hello or WebAuthn assertions through native APIs, as in the ROADtools Windows Hello assertion scripts."
name: roadtools_hello_assertion_script_base
status: experimental
description: "Detects PowerShell script blocks that request Windows Hello or WebAuthn assertions through native APIs, as in the ROADtools Windows Hello assertion scripts."
source_yaral: "detections/roadtools/yaral/roadtools_hello_assertion_script.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, hostname, user_id, script_block_text); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
procedure_ids: "RT-P13"
log_source_prerequisites: "PowerShell script-block logging (Event 4104) normalized with ScriptBlockText in additional.fields['ScriptBlockText'] and host."
logsource:
  category: ps_script
  product: windows
detection:
  sel:
    product_event_type: "4104"
    script_block_text|re: "(?i)(WebAuthNAuthenticatorGetAssertion|webauthn\\.dll|Microsoft Passport Key Storage Provider|NCryptSignHash)"
  condition: sel
falsepositives:
  - "Security research and authorized testing."
level: medium
