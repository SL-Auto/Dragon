title: "Detects one caller listing App Service or Function App application settings or connection strings (Microsoft.Web/sites/config/list/action) on two or more sites within 30 minutes."
name: cloudfox_azure_app_settings_secret_list_base
status: experimental
description: "Detects one caller listing App Service or Function App application settings or connection strings (Microsoft.Web/sites/config/list/action) on two or more sites within 30 minutes."
source_yaral: "detections/cloudfox/yaral/cloudfox_azure_app_settings_secret_list.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, caller, resource_name, source_ip); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#procedure-analysis; reviews/cloudfox/detection-review.md"
procedure_ids: "CF-Z04"
log_source_prerequisites: "Azure Activity Log (administrative category) with operationName in metadata.product_event_type, caller in principal.user.userid and resourceId in target.resource.name."
logsource:
  category: azure_activity
  product: azure
detection:
  sel:
    product_event_type|re: "(?i)^MICROSOFT\\.WEB/SITES/(SLOTS/)?CONFIG/LIST/ACTION$"
  condition: sel
falsepositives:
  - "Deployment pipelines, App Service backup or migration tooling, and administrators using the portal configuration blade."
level: high
