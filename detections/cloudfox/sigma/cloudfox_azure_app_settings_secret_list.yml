title: "Detects one caller listing App Service or Function App application settings or connection strings (Microsoft.Web/sites/config/list/action) on two or more sites within 30 minutes."
name: cloudfox_azure_app_settings_secret_list
status: experimental
correlation:
  type: value_count
  rules:
    - cloudfox_azure_app_settings_secret_list_base
  group-by:
    - caller
  timespan: 30m
  condition:
    field: resource_name
    gte: 2
level: high
