title: "Detects one GCP principal reading IAM policies (getIamPolicy) on ten or more distinct resources within 30 minutes."
name: cloudfox_gcp_iam_policy_read_fanout
status: experimental
correlation:
  type: value_count
  rules:
    - cloudfox_gcp_iam_policy_read_fanout_base
  group-by:
    - principal_email
  timespan: 30m
  condition:
    field: resource_name
    gte: 10
level: medium
