title: "Detects a process launched with CloudFox's provider-plus-module argument grammar (for example aws outbound-assumed-roles, aws env-vars, azure tokencache, gcp hiddenadmins) on a monitored endpoint. The grammar survives renaming the binary and uses module names that do not collide with the AWS, Azure or gcloud CLIs."
name: cloudfox_cli_module_grammar_execution_base
status: experimental
description: "Detects a process launched with CloudFox's provider-plus-module argument grammar (for example aws outbound-assumed-roles, aws env-vars, azure tokencache, gcp hiddenadmins) on a monitored endpoint. The grammar survives renaming the binary and uses module names that do not collide with the AWS, Azure or gcloud CLIs."
source_yaral: "detections/cloudfox/yaral/cloudfox_cli_module_grammar_execution.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (event_type, hostname, process_path, command_line); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#completeness-inventory; public-rules/comparisons/cloudfox/cloudfox_aws_authorization_details_dump.md; reviews/cloudfox/detection-review.md#cf-dr-12"
procedure_ids: "CF-X01"
log_source_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, Linux auditd EXECVE or EDR) with the full command line and image path."
logsource:
  category: process_creation
  product: windows
detection:
  sel:
    event_type: "PROCESS_LAUNCH"
    command_line|re: "(?i)(^|\\s)(aws\\s+(all-checks|access-keys|api-gw|env-vars|filesystems|iam-simulator|ecs-tasks|elastic-network-interfaces|network-ports|outbound-assumed-roles|principals|resource-trusts|role-trusts|workloads|cape|pmapper)|azure\\s+(whoami|tokencache|rbac|automation)|gcp\\s+(all-checks|hiddenadmins|privesc|lateralmovement|dataexfiltration|foxmapper|bucketenum|logenum|bigqueryenum|domainwidedelegation|workloadidentity))(\\s|$)"
  condition: sel
falsepositives:
  - "Authorized cloud security assessments; internal wrappers that reuse CloudFox module names."
level: high
---
title: "Detects a process launched with CloudFox's provider-plus-module argument grammar (for example aws outbound-assumed-roles, aws env-vars, azure tokencache, gcp hiddenadmins) on a monitored endpoint. The grammar survives renaming the binary and uses module names that do not collide with the AWS, Azure or gcloud CLIs."
name: cloudfox_cli_module_grammar_execution
status: experimental
correlation:
  type: event_count
  rules:
    - cloudfox_cli_module_grammar_execution_base
  group-by:
    - hostname
    - process_path
  timespan: 60m
  condition:
    gte: 1
level: high
