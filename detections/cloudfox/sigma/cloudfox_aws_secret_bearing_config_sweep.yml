title: "Detects one AWS principal reading three or more kinds of secret-bearing configuration within 30 minutes: instance user data, ECS task definitions, CodeBuild projects, CloudFormation templates or Lambda function configuration."
name: cloudfox_aws_secret_bearing_config_sweep_base
status: experimental
description: "Detects one AWS principal reading three or more kinds of secret-bearing configuration within 30 minutes: instance user data, ECS task definitions, CodeBuild projects, CloudFormation templates or Lambda function configuration."
source_yaral: "detections/cloudfox/yaral/cloudfox_aws_secret_bearing_config_sweep.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#procedure-analysis; reviews/cloudfox/detection-review.md"
procedure_ids: "CF-A05"
log_source_prerequisites: "userAgent in network.http.user_agent (console traffic excluded, CF-DR-02); AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, eventSource in target.application, userIdentity ARN in principal.user.userid."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type:
      - "DescribeInstanceAttribute"
      - "DescribeTaskDefinition"
      - "BatchGetProjects"
      - "GetTemplate"
      - "ListFunctions"
      - "GetFunctionConfiguration"
  filter0:
    user_agent|re: "(?i)(console\\.amazonaws\\.com|signin\\.amazonaws\\.com|AWS Internal)"
  condition: sel and not filter0
falsepositives:
  - "Deployment pipelines and cloud-governance tools that read several configuration types; approve their role ARNs."
level: high
---
title: "Detects one AWS principal reading three or more kinds of secret-bearing configuration within 30 minutes: instance user data, ECS task definitions, CodeBuild projects, CloudFormation templates or Lambda function configuration."
name: cloudfox_aws_secret_bearing_config_sweep
status: experimental
correlation:
  type: value_count
  rules:
    - cloudfox_aws_secret_bearing_config_sweep_base
  group-by:
    - principal_arn
  timespan: 30m
  condition:
    field: product_event_type
    gte: 3
level: high
