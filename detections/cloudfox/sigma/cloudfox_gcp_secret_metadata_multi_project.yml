title: "Detects one GCP principal listing Secret Manager secrets in five or more distinct projects within 30 minutes. The secrets module iterates every accessible project, so the cross-project sweep locates secrets before any targeted value access."
name: cloudfox_gcp_secret_metadata_multi_project_base
status: experimental
description: "Detects one GCP principal listing Secret Manager secrets in five or more distinct projects within 30 minutes. The secrets module iterates every accessible project, so the cross-project sweep locates secrets before any targeted value access."
source_yaral: "detections/cloudfox/yaral/cloudfox_gcp_secret_metadata_multi_project.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, principal_email, project_id); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#procedure-analysis; public-rules/comparisons/cloudfox/cloudfox_gcp_multi_service_inventory.md; reviews/cloudfox/detection-review.md#cf-dr-11"
procedure_ids: "CF-G06"
log_source_prerequisites: "GCP Cloud Audit Logs Data Access for Secret Manager (ListSecrets is DATA_READ), normalized with methodName in metadata.product_event_type, principalEmail in principal.user.email_addresses and the project ID in target.cloud.project.name."
logsource:
  category: gcp_audit
  product: gcp
detection:
  sel:
    product_event_type|re: "(?i)SecretManagerService\\.ListSecrets$"
  condition: sel
falsepositives:
  - "Secret-inventory, compliance and governance service accounts that enumerate secrets organization-wide."
level: medium
