title: "Detects one GCP principal listing Secret Manager secrets in five or more distinct projects within 30 minutes. The secrets module iterates every accessible project, so the cross-project sweep locates secrets before any targeted value access."
name: cloudfox_gcp_secret_metadata_multi_project
status: experimental
correlation:
  type: value_count
  rules:
    - cloudfox_gcp_secret_metadata_multi_project_base
  group-by:
    - principal_email
  timespan: 30m
  condition:
    field: project_id
    gte: 5
level: medium
