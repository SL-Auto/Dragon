title: "Detects programmatic (non-console) cloudtrail:LookupEvents filtered to AssumeRole, used to learn which roles have been assumed from the account."
name: cloudfox_aws_programmatic_assumerole_history_lookup_base
status: experimental
description: "Detects programmatic (non-console) cloudtrail:LookupEvents filtered to AssumeRole, used to learn which roles have been assumed from the account."
source_yaral: "detections/cloudfox/yaral/cloudfox_aws_programmatic_assumerole_history_lookup.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_name, product_event_type, principal_arn, event_source, source_ip, user_agent, lookup_attributes); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#procedure-analysis; reviews/cloudfox/detection-review.md"
procedure_ids: "CF-A07"
log_source_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, eventSource in target.application, userIdentity ARN in principal.user.userid; requestParameters.lookupAttributes serialized in additional.fields['lookupAttributes'] and userAgent in network.http.user_agent."
logsource:
  category: cloudtrail
  product: aws
detection:
  sel:
    product_name: "AWS CloudTrail"
    product_event_type: "LookupEvents"
    lookup_attributes|re: "(?i)AssumeRole"
  filter0:
    user_agent|re: "(?i)(console\\.amazonaws\\.com|signin\\.amazonaws\\.com|AWS Internal)"
  condition: sel and not filter0
falsepositives:
  - "Security analysts and SOAR playbooks querying CloudTrail history via SDK."
level: low
---
title: "Detects programmatic (non-console) cloudtrail:LookupEvents filtered to AssumeRole, used to learn which roles have been assumed from the account."
name: cloudfox_aws_programmatic_assumerole_history_lookup
status: experimental
correlation:
  type: event_count
  rules:
    - cloudfox_aws_programmatic_assumerole_history_lookup_base
  group-by:
    - principal_arn
  timespan: 60m
  condition:
    gte: 1
level: low
