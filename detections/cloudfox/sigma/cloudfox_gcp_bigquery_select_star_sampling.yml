title: "Detects one GCP principal running BigQuery query jobs of the form SELECT * FROM project.dataset.table LIMIT n against two or more tables within 30 minutes, the shape of automated sensitive-data sampling."
name: cloudfox_gcp_bigquery_select_star_sampling_base
status: experimental
description: "Detects one GCP principal running BigQuery query jobs of the form SELECT * FROM project.dataset.table LIMIT n against two or more tables within 30 minutes, the shape of automated sensitive-data sampling."
source_yaral: "detections/cloudfox/yaral/cloudfox_gcp_bigquery_select_star_sampling.yaral"
translation_status: experimental_needs_backend_mapping_and_validation
fidelity: high
schema_profile: schemas/sigma.yml
field_mapping: "normalized columns (product_event_type, principal_email, query); EQL uses ECS equivalents; enrichment columns map from UDM additional.fields / labels of the same name"
assumptions_and_gaps: "Base rule plus Sigma correlation for the threshold. "
references:
  - "reports/cloudfox/source-analysis.md#procedure-analysis; reviews/cloudfox/detection-review.md"
procedure_ids: "CF-G03"
log_source_prerequisites: "GCP Cloud Audit Logs normalized with methodName in metadata.product_event_type, serviceName in target.application, resourceName in target.resource.name and principalEmail in principal.user.email_addresses; BigQuery job query text in additional.fields['query']."
logsource:
  category: gcp_audit
  product: gcp
detection:
  sel:
    product_event_type|re: "(?i)(jobservice\\.insert|JobService\\.InsertJob|jobs\\.insert)"
    query|re: "(?i)^\\s*SELECT\\s+\\*\\s+FROM\\s+`[^`]+\\.[^`]+\\.[^`]+`\\s+LIMIT\\s+\\d+\\s*$"
  condition: sel
falsepositives:
  - "Data-catalog profilers, DLP scanners and analysts previewing tables; approve their service accounts."
level: high
---
title: "Detects one GCP principal running BigQuery query jobs of the form SELECT * FROM project.dataset.table LIMIT n against two or more tables within 30 minutes, the shape of automated sensitive-data sampling."
name: cloudfox_gcp_bigquery_select_star_sampling
status: experimental
correlation:
  type: value_count
  rules:
    - cloudfox_gcp_bigquery_select_star_sampling_base
  group-by:
    - principal_email
  timespan: 30m
  condition:
    field: query
    gte: 2
level: high
