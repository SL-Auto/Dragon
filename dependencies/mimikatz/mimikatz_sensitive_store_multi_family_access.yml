schema_version: 1
tool_id: mimikatz
rule_name: mimikatz_sensitive_store_multi_family_access
canonical_path: detections/mimikatz/yaral/mimikatz_sensitive_store_multi_family_access.yaral
canonical_sha256: 69425346059ca4891843ef1772ff67d42b29f4e9622d341bdf43e55dda72edba
description: "Correlates one process reading two independent sensitive-store families (credential manager/Vault versus crypto/certificate/Hello, IIS, SCCM/Citrix or RDM stores) as a stronger compensating signal for broad single-path store access."
severity: high
procedure_ids: ["P18", "P19", "P20", "P23", "P25", "P37", "P41", "P46"]
validation_status: "needs_validation"
telemetry_prerequisites: "EDR sensitive file or registry read telemetry with process, host and user identity, sufficient to distinguish at least two of: Credential Manager/Vault; DPAPI/crypto/certificate/Hello key stores; IIS configuration; SCCM/VSS/Citrix; Remote Desktop Manager."
atomic_event_types: ["FILE_READ", "REGISTRY_READ"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.process.product_specific_process_id", "principal.user.userid", "target.resource.name"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: false
uses_absence_logic: false
false_positives: "Backup, migration, credential-manager, endpoint-security and IT-provisioning tools that legitimately enumerate more than one store family in a session."
references: "reports/mimikatz/source-analysis.md; public-rules/comparisons/mimikatz/mimikatz_sensitive_store_access.md"
