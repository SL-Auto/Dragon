telemetry_prerequisites: "GCP Cloud Audit Logs normalized with methodName in metadata.product_event_type, serviceName in target.application, resourceName in target.resource.name and principalEmail in principal.user.email_addresses; DATA_READ Data Access logs enabled for Cloud Storage and Cloud Logging."
atomic_event_types: ["ListLogEntries"]
required_udm_fields: ["metadata.product_event_type", "principal.user.email_addresses", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Log exporters, SIEM collectors, backup and data-catalog services."
