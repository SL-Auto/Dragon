schema_version: 1
tool_id: cloudfox
rule_name: cloudfox_aws_multi_service_enumeration_fanout
canonical_path: detections/cloudfox/yaral/cloudfox_aws_multi_service_enumeration_fanout.yaral
canonical_sha256: 2a76f1b0b629c316597ce214f70bb83d73f46db054d6a0e09552620bd861e88a
description: "Detects one AWS principal issuing List, Describe or Get calls to fifteen or more distinct AWS services within 30 minutes, the breadth signature of automated account enumeration."
severity: medium
procedure_ids: ["CF-A01", "CF-A02", "CF-A04", "CF-A06"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, eventSource in target.application, userIdentity ARN in principal.user.userid; read-only management events enabled on the trail; userAgent in network.http.user_agent (console sessions excluded, CF-DR-09)."
atomic_event_types: ["Describe", "List"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "network.http.user_agent", "principal.ip", "principal.user.userid", "target.application"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "CSPM, inventory, backup and cloud-governance platforms; approved security assessments. Approve their role ARNs."
