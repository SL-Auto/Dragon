description: "Detects a process launched with CloudFox's provider-plus-module argument grammar (for example aws outbound-assumed-roles, aws env-vars, azure tokencache, gcp hiddenadmins) on a monitored endpoint. The grammar survives renaming the binary and uses module names that do not collide with the AWS, Azure or gcloud CLIs."
severity: high
procedure_ids: ["CF-X01"]
validation_status: "needs_validation"
telemetry_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, Linux auditd EXECVE or EDR) with the full command line and image path."
atomic_event_types: ["PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.user.userid", "target.process.command_line", "target.process.file.full_path"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Authorized cloud security assessments; internal wrappers that reuse CloudFox module names."
