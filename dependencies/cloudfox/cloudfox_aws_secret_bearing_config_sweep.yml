procedure_ids: ["CF-A05"]
validation_status: "needs_validation"
telemetry_prerequisites: "userAgent in network.http.user_agent (console traffic excluded, CF-DR-02); AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, eventSource in target.application, userIdentity ARN in principal.user.userid."
atomic_event_types: ["BatchGetProjects", "DescribeTaskDefinition", "GetTemplate", "ListFunctions"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "network.http.user_agent", "principal.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Deployment pipelines and cloud-governance tools that read several configuration types; approve their role ARNs."
