atomic_event_types: []
required_udm_fields: ["metadata.product_event_type", "principal.ip", "principal.user.email_addresses", "target.cloud.project.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Secret-inventory, compliance and governance service accounts that enumerate secrets organization-wide."
