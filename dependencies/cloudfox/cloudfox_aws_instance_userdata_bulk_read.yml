schema_version: 1
tool_id: cloudfox
rule_name: cloudfox_aws_instance_userdata_bulk_read
canonical_path: detections/cloudfox/yaral/cloudfox_aws_instance_userdata_bulk_read.yaral
canonical_sha256: a32256881e56432e5ce0ad4bb0fa06eeeb08a16f3d1a1e820c23a73bed408b5c
description: "Detects one AWS principal reading EC2 instance user data (DescribeInstanceAttribute with attribute userData) for three or more instances within 30 minutes, harvesting bootstrap scripts that often embed credentials."
severity: high
procedure_ids: ["CF-A05"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, eventSource in target.application, userIdentity ARN in principal.user.userid; requestParameters.attribute in additional.fields['attribute'] and instanceId in target.resource.name; userIdentity.invokedBy in additional.fields['invokedBy'] (calls made by AWS services on a principal's behalf are excluded, CF-DR-10)."
atomic_event_types: ["DescribeInstanceAttribute"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "metadata.product_name", "principal.ip", "principal.user.userid", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Configuration-management or migration tooling that inspects user data; approve their role ARNs."
