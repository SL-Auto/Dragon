schema_version: 1
tool_id: cloudfox
rule_name: cloudfox_gcp_multi_service_inventory
canonical_path: detections/cloudfox/yaral/cloudfox_gcp_multi_service_inventory.yaral
canonical_sha256: a4177dbc097a7601153a44484c00b15abd3af0eff292f4dce31b739c2ea1fdb7
description: "Detects one GCP principal issuing list, get or search calls to ten or more distinct GCP services within 30 minutes, including Cloud Asset SearchAllResources and secret metadata listing."
severity: medium
procedure_ids: ["CF-G02", "CF-G06"]
validation_status: "needs_validation"
telemetry_prerequisites: "GCP Cloud Audit Logs normalized with methodName in metadata.product_event_type, serviceName in target.application, resourceName in target.resource.name and principalEmail in principal.user.email_addresses; Data Access logs enabled for the inventoried services (coverage scales with enablement)."
atomic_event_types: ["aggregatedList", "Get", "Search"]
required_udm_fields: ["metadata.product_event_type", "principal.user.email_addresses", "target.application"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Security Command Center, CSPM and asset-inventory service accounts."
references: "reports/cloudfox/source-analysis.md#procedure-analysis; reviews/cloudfox/detection-review.md"
