schema_version: 1
tool_id: impacket
rule_name: impacket_terminal_services_session_control_by_other_actor
canonical_path: detections/impacket/yaral/impacket_terminal_services_session_control_by_other_actor.yaral
canonical_sha256: aaf4f62b3e88bf1516a2475b25f727bd50fdfe7915cff20dca2db23883b99c43
description: "Detects a Terminal Services session connect, disconnect, reconnect or logoff control action performed by a principal different from the session's own target user, consistent with remote session hijack or tscon-style session takeover."
severity: high
procedure_ids: ["IMP-18"]
validation_status: "needs_validation"
telemetry_prerequisites: "Terminal Services Operational and Security session events (4778/4779/23/24/25) with both a populated principal (acting) and target (session-owning) user identity."
atomic_event_types: ["23", "24", "4779"]
required_udm_fields: ["metadata.product_event_type", "principal.hostname", "principal.user.userid", "target.user.userid"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Helpdesk-initiated session shadowing/takeover, session broker or load-balancer service accounts, and RDS farm reconnection performed under a management service identity."
references: "reports/impacket/source-analysis.md"
