schema_version: 1
tool_id: impacket
rule_name: impacket_ntlm_relay_with_privileged_effect
canonical_path: detections/impacket/yaral/impacket_ntlm_relay_with_privileged_effect.yaral
canonical_sha256: 7e380149430debcbc76766265771de27b0abb69ca5aa68bda8a1499667e5603e
description: "Correlates NTLM authentication (4624/4776) with a privileged target-side effect (service install, account/group change, or AD authorization change) by the same account on the same host, requiring the target-side effect that the base cross-source relay rule does not."
severity: critical
procedure_ids: ["IMP-21"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalized Windows Security 4624 network logons (LogonType 3) with AuthenticationPackageName, target host, target account and source IP, correlated on the same host and acting account with service (4697/7045), account/group (4720-4757 family) or AD-authorization change (5136/5137) events. 4776 is DC-side credential validation and is not used because its host is the validating DC, not the relay target."
atomic_event_types: ["4624", "4720", "4722", "4723", "4724", "4725", "4726", "4728", "4729", "4732", "4733", "4738", "4741", "4742", "4743", "4756", "4757", "5136", "7045"]
required_udm_fields: ["additional.fields", "metadata.event_timestamp.seconds", "metadata.product_event_type", "principal.ip", "principal.user.userid", "target.hostname", "target.user.userid"]
correlation_window: "5m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Administrators who authenticate and then immediately perform routine privileged administration on the same host within the correlation window."
references: "reports/impacket/source-analysis.md"
