schema_version: 1
tool_id: impacket
rule_name: impacket_wmi_activity_operational_class_signal
canonical_path: detections/impacket/yaral/impacket_wmi_activity_operational_class_signal.yaral
canonical_sha256: 2962d814c60df2e0329b39de9b6bbb339bc7cf0a8597546ddfd807058c199eee
description: "Detects a remote WMI method invocation against the Win32_Process class observed directly in the WMI-Activity Operational log, independent of whether a WmiPrvSE child process was collected."
severity: medium
procedure_ids: ["IMP-05"]
validation_status: "needs_validation"
telemetry_prerequisites: "WMI-Activity Operational 5857/5858/5860/5861 with the operation text parsed into a class label and the caller (ClientMachine) normalized to principal.hostname. Successful Win32_Process.Create calls are not logged by WMI-Activity; this rule sees mainly 5858 failures and 5860/5861 subscription records (review REVIEW-012)."
atomic_event_types: ["5858", "5860"]
required_udm_fields: ["metadata.product_event_type", "principal.hostname", "principal.ip", "target.resource.attribute.labels"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Endpoint management, inventory, remediation, monitoring agents and any authorized WMI administration that creates or queries Win32_Process; this event family is high-volume and requires tenant baselining before enforcement."
references: "reports/impacket/source-analysis.md"
