schema_version: 1
tool_id: cobalt-strike-beacon
rule_name: cobalt_strike_remote_management_execution_compensating_signal
canonical_path: detections/cobalt-strike-beacon/yaral/cobalt_strike_remote_management_execution_compensating_signal.yaral
canonical_sha256: 79a26523202d6118b5ac34c21280381b309882a1650d60f3e97b08cb350f427a
description: "Correlates a WinRM, remote WMI or SSH session on a target with a subsequent process launched by the matching remote-management host process (wsmprovhost.exe, wmiprvse.exe or sshd) as the same account. This replaces the base rule's any-process-by-the-same-user join with process lineage that ties the child to the remote-management channel."
severity: medium
procedure_ids: ["CSB-031", "CSB-032", "CSB-033"]
validation_status: "needs_validation"
telemetry_prerequisites: "Target-side WINRM_SESSION, WMI_REMOTE_OPERATION or SSH_AUTH events with target host and account, plus PROCESS_LAUNCH on the same host where principal.process is the launching (parent) process, joined on host and account within 10 minutes, session first."
atomic_event_types: ["PROCESS_LAUNCH", "SSH_AUTH", "WINRM_SESSION", "WMI_REMOTE_OPERATION"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "principal.hostname", "principal.ip", "principal.process.file.full_path", "principal.user.userid", "target.hostname", "target.process.file.full_path"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Remote administration, configuration management (DSC, Ansible over WinRM/SSH), monitoring and patching that run commands through WinRM, WMI or SSH."
references: "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_remote_management_execution.md; reviews/cobalt-strike-beacon/detection-review.md#dr-23"
