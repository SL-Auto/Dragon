schema_version: 1
tool_id: cobalt-strike-beacon
rule_name: cobalt_strike_sensitive_file_activity_compensating_signal
canonical_path: detections/cobalt-strike-beacon/yaral/cobalt_strike_sensitive_file_activity_compensating_signal.yaral
canonical_sha256: 9f1e9c1545f0d539b625d3ebd0d789c272bcf09c0f8d02f4e7c87ad5c872d6ed
description: "Aggregates sensitive-file reads by user and host across processes and correlates them with archive creation by the same user/host, covering multi-process collection where one process stages files and another compresses or transmits them."
severity: high
procedure_ids: ["CSB-024", "CSB-025"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize FILE_READ with sensitivity classification, and FILE_CREATION/FILE_MODIFICATION for archive-extension targets, joined on host and user within 30 minutes, at least one read before the archive write."
atomic_event_types: ["FILE_MODIFICATION", "FILE_READ"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "principal.hostname", "principal.user.userid", "target.file.full_path", "target.file.sensitivity"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Backup, synchronization, DLP, indexing, and document-management tools that read multiple sensitive files and then write compressed archives."
