description: "Detects repeated process-attributed TXT/NULL-type DNS queries to domains flagged as rare by baseline enrichment, covering low-volume record-type-specific tunneling exchanges that the length/entropy-based base rule does not filter by record type."
severity: medium
procedure_ids: ["CSB-006"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize process-attributed NETWORK_DNS (for example Sysmon 22 or EDR DNS events; DNS Client service-attributed resolver logs cannot attribute the requesting process) with host, process ID, query name/type, and a domain-rarity baseline enrichment field."
atomic_event_types: []
required_udm_fields: ["additional.fields", "metadata.event_type", "network.dns.questions.name", "network.dns.questions.type", "principal.hostname", "principal.process.product_specific_process_id"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Mail-security appliances and anti-abuse services performing bulk legitimate TXT lookups against rare or newly observed domains; the rarity enrichment must be tenant-tuned before enabling."
