schema_version: 1
tool_id: cobalt-strike-beacon
rule_name: cobalt_strike_user_data_collection_compensating_signal
canonical_path: detections/cobalt-strike-beacon/yaral/cobalt_strike_user_data_collection_compensating_signal.yaral
canonical_sha256: 78676c2198e4944fbd3315aee5d8655dc08843a2b569613ede13577f0fcfca74
description: "Correlates a user-data collection effect (screen, clipboard, input, or browser-secret) with an outbound network connection from the same process shortly afterward, distinguishing collection-then-egress from a single benign access that the base standalone-effect rule cannot separate."
severity: high
procedure_ids: ["CSB-027"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize vendor SCREEN_CAPTURE/CLIPBOARD_READ/INPUT_CAPTURE/BROWSER_SECRET_READ and outbound NETWORK_CONNECTION with a stable vendor process identifier (product_specific_process_id), joined on host and process within 15 minutes, collection first."
atomic_event_types: ["CLIPBOARD_READ", "INPUT_CAPTURE", "NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "network.direction", "principal.hostname", "principal.process.product_specific_process_id"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Assistive technology, conferencing, remote support, password managers, browsers, and approved monitoring software that both collect and transmit data as part of normal operation."
