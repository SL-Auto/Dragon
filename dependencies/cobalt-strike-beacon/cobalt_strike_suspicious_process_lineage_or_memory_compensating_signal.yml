atomic_event_types: ["EXECUTABLE_MEMORY", "THREAD_START"]
required_udm_fields: ["additional.fields", "metadata.event_timestamp.seconds", "metadata.event_type", "principal.hostname", "principal.process.product_specific_process_id"]
