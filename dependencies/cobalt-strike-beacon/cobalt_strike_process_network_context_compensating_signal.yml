description: "Detects low-variance periodic outbound connections from a rare-prevalence process to a rare destination, adding the classic beacon-interval and destination-novelty dimensions that the base rarity-only fan-in rule does not measure."
severity: high
procedure_ids: ["CSB-001", "CSB-002", "CSB-005"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize NETWORK_CONNECTION with process hash and prevalence, destination hostname and a destination-prevalence enrichment, and an interval-variance-bucket enrichment derived from inter-connection timing."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["additional.fields", "metadata.event_type", "principal.process.file.prevalence", "principal.process.file.sha256", "target.hostname"]
correlation_window: "2h"
uses_multi_event_correlation: true
uses_aggregation: false
uses_absence_logic: false
false_positives: "Software updaters, telemetry/monitoring agents, and any low-jitter scheduled task that also happens to run from a rare process against a rare destination."
