description: "Correlates a rare-process socket listen with an accepted inbound connection on the same port and process, closing the gap between merely listening and actually receiving a connection that the base standalone-listen rule leaves open."
severity: high
procedure_ids: ["CSB-008"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize SOCKET_LISTEN and inbound NETWORK_CONNECTION with a stable vendor process identifier (product_specific_process_id), process signer/prevalence, and port, joined on host, process and port within 30 minutes, listen first."
atomic_event_types: ["NETWORK_CONNECTION", "SOCKET_LISTEN"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "network.direction", "principal.hostname", "principal.process.file.is_signed", "principal.process.file.prevalence", "principal.process.product_specific_process_id", "target.port", "target.process.product_specific_process_id"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: false
uses_absence_logic: false
false_positives: "Development tools and local services that legitimately listen from rare binaries and receive local or authorized connections."
