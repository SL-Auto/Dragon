schema_version: 1
tool_id: cobalt-strike-beacon
rule_name: cobalt_strike_remote_service_sequence_compensating_signal
canonical_path: detections/cobalt-strike-beacon/yaral/cobalt_strike_remote_service_sequence_compensating_signal.yaral
canonical_sha256: 4d2fd342e2da40eeb332b0c8a7a2b947355e78e3b29a7315bc8fbdac6987846d
description: "Correlates a file staged to a remote target with a subsequent System 7045 service install on that target whose service image file name equals the staged file name, tightening the base rule's looser source/account/host proximity join; file-name matching tolerates UNC versus local path forms."
severity: high
procedure_ids: ["CSB-030"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize FILE_CREATION/FILE_MODIFICATION written to a remote target host (SMB/admin-share write with source and target host and full path), and System 7045 on that target with the installed service image path, joined on source host, target host and image file name within 10 minutes, write first."
atomic_event_types: ["7045", "FILE_MODIFICATION"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "metadata.product_event_type", "principal.hostname", "target.file.full_path", "target.hostname", "target.process.file.full_path"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Software distribution and endpoint-management tools that stage an installer to a share and then register it as a service using the identical path."
references: "reports/cobalt-strike-beacon/source-analysis.md; public-rules/comparisons/cobalt-strike-beacon/cobalt_strike_remote_service_sequence.md"
