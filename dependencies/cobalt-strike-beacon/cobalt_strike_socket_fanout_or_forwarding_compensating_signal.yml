required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "network.direction", "principal.hostname", "principal.process.product_specific_process_id", "target.ip", "target.process.product_specific_process_id"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Browsers, approved proxies, EDR, backup, and orchestration agents that legitimately combine inbound acceptance with outbound fan-out."
