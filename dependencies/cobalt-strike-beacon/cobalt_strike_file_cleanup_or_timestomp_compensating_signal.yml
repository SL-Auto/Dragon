telemetry_prerequisites: "Normalize PROCESS_LAUNCH and FILE_DELETE with matching full path, host, and process signer/prevalence on the deleting process, joined within 15 minutes."
atomic_event_types: ["PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "principal.hostname", "principal.process.file.is_signed", "principal.process.file.prevalence", "target.file.full_path", "target.process.file.full_path"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: false
uses_absence_logic: false
false_positives: "Installers, updaters, and self-extracting archives remain a false-positive source when they are unsigned or rare; the signer/prevalence gate narrows but does not eliminate this overlap."
