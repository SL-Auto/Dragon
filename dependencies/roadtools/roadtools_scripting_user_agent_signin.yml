description: "Detects user or service-principal sign-ins, or Graph requests, whose user agent is a Python HTTP library default (python-requests or aiohttp), as used by ROADtools when no user agent is chosen."
severity: medium
procedure_ids: ["RT-P01", "RT-P04", "RT-P06", "RT-P07", "RT-P10", "RT-P11"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields; MicrosoftGraphActivityLogs with UserAgent."
atomic_event_types: ["AADNonInteractiveUserSignInLogs", "AADServicePrincipalSignInLogs"]
required_udm_fields: ["metadata.product_event_type", "network.http.user_agent", "principal.ip", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Approved Python automation and service principals; security tooling."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
