description: "Detects sign-in or HTTP activity with the fixed legacy user agent ROADtools sends during PRT-cookie authentication: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 10.0; Win64; x64; Trident/7.0; .NET4.0C; .NET4.0E)."
severity: medium
procedure_ids: ["RT-P04"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields; proxy NETWORK_HTTP with User-Agent where available."
atomic_event_types: []
required_udm_fields: ["metadata.product_event_type", "network.http.user_agent", "principal.ip", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Legacy embedded web controls presenting compatibility user agents."
