description: "Detects a device registration by a user followed within 1 hour by a Windows Hello for Business key or passkey being added to that user, the persistence sequence of registering an attacker device and binding a key to it."
severity: medium
procedure_ids: ["RT-P03", "RT-P05"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID audit logs (AuditLogs) normalized with activityDisplayName in metadata.product_event_type, initiating user in principal.user.userid, target user or device in target.user.userid or target.resource.name, and modified-property values in additional.fields['modifiedProperties']."
atomic_event_types: ["FIDO2", "passkey", "security info", "security key"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.product_event_type", "principal.user.userid", "target.resource.name", "target.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Legitimate new-device enrollment with Windows Hello provisioning."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
