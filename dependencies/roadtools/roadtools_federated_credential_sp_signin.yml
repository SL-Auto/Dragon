schema_version: 1
tool_id: roadtools
rule_name: roadtools_federated_credential_sp_signin
canonical_path: detections/roadtools/yaral/roadtools_federated_credential_sp_signin.yaral
canonical_sha256: 7646bc4bbb00520845c50d866a3403b5eba67102edd1a1a0e5fc553b7e5fc500
description: "Detects service-principal sign-ins that authenticate with a federated identity credential (client assertion from an external issuer) from an IP outside Azure and GitHub-style workload ranges, consistent with an attacker-run OIDC issuer."
severity: medium
procedure_ids: ["RT-P07"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields; clientCredentialType in additional.fields['clientCredentialType'] and the issuer in additional.fields['federatedCredentialIssuer']."
atomic_event_types: ["AADServicePrincipalSignInLogs"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "principal.ip", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "New CI/CD integrations with external OIDC issuers."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
