description: "Detects device registration or join of a device named DESKTOP- followed by seven upper-case alphanumerics where the registration was not performed by device-management enrollment (Intune or Autopilot)."
severity: low
procedure_ids: ["RT-P03"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID audit logs (AuditLogs) normalized with activityDisplayName in metadata.product_event_type, initiating user in principal.user.userid, target user or device in target.user.userid or target.resource.name, and modified-property values in additional.fields['modifiedProperties']; enrollment service in additional.fields['initiatedByApp']."
atomic_event_types: []
required_udm_fields: ["additional.fields", "metadata.product_event_type", "principal.user.userid", "target.resource.name"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "New Windows devices registered outside Intune or Autopilot."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
