schema_version: 1
tool_id: roadtools
rule_name: roadtools_device_registration_then_prt_signin
canonical_path: detections/roadtools/yaral/roadtools_device_registration_then_prt_signin.yaral
canonical_sha256: 20a0bed28ae5635f11c004423a4e5079d980a5b5da1134bb9cc5c6d6f06157c4
description: "Detects a device registration by a user followed within 1 hour by a sign-in by that user whose incoming token type is a Primary Refresh Token, the sequence of registering an attacker device and then using its PRT."
severity: high
procedure_ids: ["RT-P03", "RT-P04"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID audit logs (AuditLogs) normalized with activityDisplayName in metadata.product_event_type, initiating user in principal.user.userid, target user or device in target.user.userid or target.resource.name, and modified-property values in additional.fields['modifiedProperties']; Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields."
atomic_event_types: []
required_udm_fields: ["additional.fields", "metadata.event_timestamp.seconds", "metadata.product_event_type", "principal.ip", "principal.user.userid", "target.resource.name"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Users enrolling new corporate devices (Autopilot, first sign-in)."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
