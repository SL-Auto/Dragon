schema_version: 1
tool_id: roadtools
rule_name: roadtools_foci_refresh_token_client_hopping
canonical_path: detections/roadtools/yaral/roadtools_foci_refresh_token_client_hopping.yaral
canonical_sha256: bbeed740a4aff7dc04b342109e3f5f4cf27ca705467658b321520c9add875527
description: "Detects one user obtaining tokens for four or more distinct client applications through non-interactive refresh-token sign-ins within 30 minutes, the family-of-client-IDs pivot used to expand token scope."
severity: high
procedure_ids: ["RT-P02"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields."
atomic_event_types: ["AADNonInteractiveUserSignInLogs"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "principal.ip", "principal.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Users running several Microsoft 365 desktop apps at sign-in time; Office suite bootstrap on new devices."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
