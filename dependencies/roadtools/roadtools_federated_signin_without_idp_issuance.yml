schema_version: 1
tool_id: roadtools
rule_name: roadtools_federated_signin_without_idp_issuance
canonical_path: detections/roadtools/yaral/roadtools_federated_signin_without_idp_issuance.yaral
canonical_sha256: 77aaee8614eb4d08b78e372151543eb28f5c91fb4dea2fbbf5cc8c2411d91447
description: "Detects a federated (SAML or WS-Federation) Entra sign-in for a user with no corresponding token-issuance event on the organization's AD FS within 10 minutes, consistent with a forged SAML token."
severity: medium
procedure_ids: ["RT-P09"]
validation_status: "needs_validation"
telemetry_prerequisites: "Entra ID sign-in logs (SigninLogs, AADNonInteractiveUserSignInLogs, AADServicePrincipalSignInLogs) normalized with the log name in metadata.product_event_type, UPN or service principal in principal.user.userid, IP in principal.ip, userAgent in network.http.user_agent, and appId, resourceId, authenticationProtocol, incomingTokenType, deviceId, sessionId and resultType in additional.fields; AD FS Security auditing events 1200 or 1202 (token issued) normalized with the user in principal.user.userid."
atomic_event_types: ["SigninLogs"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "principal.user.userid"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: true
false_positives: "AD FS audit gaps, multiple identity providers and clock skew."
references: "reports/roadtools/source-analysis.md#procedure-analysis; reviews/roadtools/detection-review.md"
