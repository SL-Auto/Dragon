schema_version: 1
tool_id: bloodhound
rule_name: bloodhound_process_to_directory_effect
canonical_path: detections/bloodhound/yaral/bloodhound_process_to_directory_effect.yaral
canonical_sha256: 14892613f472f068979cc0b750456a992fe827008455317d7d7ecd9718be801a
description: "Detects one endpoint process entity issuing LDAP searches against many distinct directory objects or search bases, independent of process prevalence, signer, executable path or a preceding launch event, compensating for bloodhound_collector_process_network_context's dependence on rarity and connection count."
severity: medium
procedure_ids: ["BH-001"]
validation_status: "needs_validation"
telemetry_prerequisites: "Endpoint-attributed LDAP_SEARCH telemetry (EDR LDAP query events) with host, stable process entity identifier, process path, account, and search base DN or per-result object identity normalized to target.resource.name. Cloud audit logs are not process-attributed and are out of scope for this rule."
atomic_event_types: []
required_udm_fields: ["metadata.product_event_type", "principal.hostname", "principal.process.file.full_path", "principal.process.product_specific_process_id", "principal.user.userid", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Identity inventory, endpoint management, directory administration consoles, backup and migration tooling, including signed and prevalent software; domain-joined services resolving many group or SID references."
references: "reports/bloodhound/source-analysis.md#bh-001, public-rules/comparisons/bloodhound/bloodhound_collector_process_network_context.md, reviews/bloodhound/detection-review.md#bh-dr-16"
