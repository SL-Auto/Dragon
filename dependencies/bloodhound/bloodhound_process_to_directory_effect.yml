required_udm_fields: ["metadata.event_type", "metadata.product_event_type", "principal.hostname", "principal.process.product_specific_process_id", "target.process.product_specific_process_id", "target.resource.name"]
correlation_window: "20m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Identity inventory, endpoint management, directory administration and cloud governance tooling, including signed and prevalent software."
