description: "Detects a single identity on one client host retrieving a high volume of distinct directory objects within one naming context over a four-hour window, compensating for single-category or throttled collection that stays under the multi-category fanout threshold of bloodhound_ldap_directory_discovery_fanout."
severity: high
procedure_ids: ["BH-002", "BH-004"]
validation_status: "needs_validation"
telemetry_prerequisites: "Directory-side or EDR LDAP_SEARCH/1644 events expanded to per-result object identity (result_object_id label), with client host, account and naming context; summary-only query events cannot satisfy this rule (see reviews/bloodhound/detection-review.md#bh-dr-10)."
atomic_event_types: []
required_udm_fields: ["metadata.product_event_type", "principal.hostname", "principal.user.userid", "target.hostname", "target.resource.attribute.labels"]
correlation_window: "4h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Identity governance, directory synchronization, migration tooling and authorized security assessment performing bulk single-category export."
