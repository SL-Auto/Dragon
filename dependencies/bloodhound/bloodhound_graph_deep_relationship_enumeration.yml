required_udm_fields: ["metadata.product_event_type", "network.http.method", "principal.application", "principal.user.userid", "target.resource.name", "target.url"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Identity governance, synchronization, compliance and cloud security posture tools performing legitimate relationship enumeration."
