description: "Detects an unverified process that has made outbound connections within the previous 15 minutes spawning a command interpreter or system utility, the effect of agent run, execute and shell commands."
severity: medium
procedure_ids: ["AX-P05"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with direction, protocol, destination IP and port, host and stable process ID; optional signature verification status. PROCESS_LAUNCH with parent process ID and image."
atomic_event_types: ["NETWORK_CONNECTION", "PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "network.direction", "principal.hostname", "principal.process.file.signature_info.verification_status", "principal.process.product_specific_process_id", "target.process.command_line", "target.process.file.full_path"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Unsigned installers and developer tools that run shell commands after downloading."
