schema_version: 1
tool_id: adaptixc2
rule_name: adaptix_raw_socket_dns_from_user_process
canonical_path: detections/adaptixc2/yaral/adaptix_raw_socket_dns_from_user_process.yaral
canonical_sha256: 5f4556e97298db4eacf64e2dfcc35cae6f43d858bae0a9cce0166474c1017a2c
description: "Detects a user-mode process other than the Windows DNS Client sending recurrent UDP/53 traffic directly to a resolver (six or more connections across four or more minutes within 30 minutes). This is the raw-socket DNS transport, which bypasses the DNS Client service and Sysmon DNS query logging."
severity: high
procedure_ids: ["AX-P02"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with direction, protocol, destination IP and port, host and stable process ID; optional signature verification status. UDP must be logged."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.event_type", "metadata.id", "network.ip_protocol", "principal.hostname", "principal.process.file.full_path", "principal.process.file.signature_info.verification_status", "principal.process.product_specific_process_id", "target.ip", "target.port"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Security agents, VPN clients and browsers with built-in DNS-over-UDP resolvers; approve by signer."
references: "reports/adaptixc2/source-analysis.md#procedure-analysis; reviews/adaptixc2/detection-review.md"
