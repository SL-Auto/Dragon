canonical_sha256: e170f9b7e8864fc6091b0ce7cc86fa632143dcb2e559bc66d5bac591d72778fb
description: "Detects an unverified, non-system process creating a named pipe that is then connected to over the network (SMB pipe access from a remote host, or a pipe connection by another host within 30 minutes), the SMB peer-to-peer transport."
severity: high
procedure_ids: ["AX-P03"]
validation_status: "needs_validation"
telemetry_prerequisites: "Sysmon Event ID 17 (pipe created, NAMED_PIPE_CREATION) and 18 (pipe connected) with pipe name and image, and Windows Security 5145 (IPC$ named-pipe access) with relative target name and source address."
atomic_event_types: ["17", "5145"]
required_udm_fields: ["metadata.product_event_type", "principal.hostname", "principal.ip", "principal.process.file.full_path", "target.hostname", "target.resource.attribute.labels", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Line-of-business services and security agents exposing named pipes to remote management."
references: "reports/adaptixc2/source-analysis.md#procedure-analysis; reviews/adaptixc2/detection-review.md"
