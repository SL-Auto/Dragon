canonical_sha256: 41a16766bcfbca4635e29eb4917c8db9fd4f4770a99805f88940bc020fd127b8
description: "Detects a command shell started by a parent process whose command line binds a program to a socket (-e, --exec, -c or --sh-exec) together with listen mode or an IP address and port. This is the effect of an Ncat or netcat bind or reverse shell, regardless of the parent's name."
severity: high
procedure_ids: ["NM-P15"]
validation_status: "needs_validation"
telemetry_prerequisites: "PROCESS_LAUNCH telemetry with child image path and the parent command line (Sysmon Event ID 1 ParentCommandLine mapped to principal.process.command_line, or EDR equivalent)."
atomic_event_types: ["PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.process.command_line", "principal.process.file.full_path", "target.process.file.full_path"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Administrators using Ncat for authorized troubleshooting with command execution."
references: "reports/nmap/source-analysis.md#procedure-analysis; public-rules/comparisons/nmap/ncat_exec_or_broker_grammar.md; reviews/nmap/detection-review.md#nm-dr-09"
