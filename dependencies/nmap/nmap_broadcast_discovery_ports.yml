description: "Detects one non-system process sending to four or more distinct local discovery protocols (LLMNR 5355, mDNS 5353, SSDP 1900, NBNS 137, DHCP 67, WS-Discovery 3702, SLP 427) within 2 minutes, the pattern of NSE broadcast scripts."
severity: medium
procedure_ids: ["NM-P11"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with destination IP and port, host and stable process ID; optional signature verification status. UDP to multicast or broadcast destinations must be logged."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.process.file.full_path", "principal.process.product_specific_process_id", "target.port"]
correlation_window: "2m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Media and device-discovery applications and network inventory tools."
