canonical_sha256: b470c8d92e088fbb175ed836f86dd545db8f86d6334f3475c13c613cd6a0a308
description: "Detects execution of the Nmap binary identified by its PE OriginalFileName (nmap.exe), which survives renaming on Windows, or by an image named nmap on other platforms. It covers default invocations such as nmap <target> that carry no option grammar."
severity: medium
procedure_ids: ["NM-P01", "NM-P02", "NM-P03", "NM-P05", "NM-P06", "NM-P07", "NM-P08"]
validation_status: "needs_validation"
telemetry_prerequisites: "PROCESS_LAUNCH telemetry with image path and PE OriginalFileName (Sysmon Event ID 1 OriginalFileName mapped to target.process.file.pe_file.original_file_name, or EDR equivalent)."
atomic_event_types: ["PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.user.userid", "target.process.command_line", "target.process.file.full_path", "target.process.file.pe_file.original_file_name"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Authorized administrators and vulnerability-management hosts running Nmap; approve by host."
references: "reports/nmap/source-analysis.md#procedure-analysis; public-rules/comparisons/nmap/nmap_cli_option_grammar.md; reviews/nmap/detection-review.md#nm-dr-08"
