procedure_ids: ["NM-P09"]
validation_status: "needs_validation"
telemetry_prerequisites: "Windows Security 4625 and 4771 (and service authentication failures normalized as USER_LOGIN with security_result.action BLOCK) with source IP, target account and target host."
