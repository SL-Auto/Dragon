required_udm_fields: ["metadata.event_type", "metadata.product_event_type", "principal.ip", "security_result.action", "target.hostname", "target.user.userid"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Misconfigured services retrying stale credentials, password-audit tools and shared NAT sources."
