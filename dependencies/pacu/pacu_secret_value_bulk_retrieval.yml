schema_version: 1
tool_id: pacu
rule_name: pacu_secret_value_bulk_retrieval
canonical_path: detections/pacu/yaral/pacu_secret_value_bulk_retrieval.yaral
canonical_sha256: 2a29ade66e83133bfc20369aa2da3b31b8070dda798e316a108c65be6f5d9c26
description: "Detects one principal retrieving five or more distinct secret values within 30 minutes through Secrets Manager GetSecretValue, or SSM GetParameter(s) with decryption, excluding calls invoked by AWS services (PA-DR-09)."
severity: high
procedure_ids: ["PA-P08"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; secretId or parameter name in target.resource.name; requestParameters.withDecryption and userIdentity.invokedBy in additional.fields."
atomic_event_types: ["GetParameters"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "metadata.product_name", "principal.user.userid", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Secret-rotation tooling, migration scripts and configuration-management agents reading many parameters."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md; public-rules/comparisons/pacu/pacu_secret_value_bulk_retrieval.md"
