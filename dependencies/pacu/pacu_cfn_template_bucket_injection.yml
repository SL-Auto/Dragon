procedure_ids: ["PA-P05"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; requestParameters.bucketName in target.resource.name."
atomic_event_types: ["PutBucketNotification"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "principal.user.userid", "target.resource.name"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Platform teams adding monitoring notifications to template buckets."
