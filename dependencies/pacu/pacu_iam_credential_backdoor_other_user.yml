canonical_sha256: 617f93f99bcee72d4a7676bb6a11077b5e707e44453e12c78e580c4a7575c038
description: "Detects an IAM principal creating an access key or console login profile for a different IAM user (CreateAccessKey, CreateLoginProfile or UpdateLoginProfile where the target user differs from the caller)."
severity: high
procedure_ids: ["PA-P03", "PA-P04"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; requestParameters.userName in target.user.userid and userIdentity.userName in principal.user.user_display_name."
atomic_event_types: ["CreateLoginProfile"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "principal.user.user_display_name", "principal.user.userid", "target.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Identity administrators and automation that provision user credentials; approve their ARNs."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
