atomic_event_types: ["RegisterTaskDefinition", "RunTask"]
required_udm_fields: ["metadata.event_timestamp.seconds", "metadata.product_event_type", "metadata.product_name", "principal.user.userid", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "CI/CD pipelines that register and run tasks; approve their role ARNs."
