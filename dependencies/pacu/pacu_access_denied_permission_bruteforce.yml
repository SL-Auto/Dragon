canonical_sha256: e12a39340194379e99563864733ff9b45221d41d7a2d64837380e30069824bfb
description: "Detects one principal receiving AccessDenied or UnauthorizedOperation errors on ten or more distinct API actions within 10 minutes, the signature of permission brute-forcing."
severity: high
procedure_ids: ["PA-P02"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; errorCode in additional.fields['errorCode']."
atomic_event_types: []
required_udm_fields: ["additional.fields", "metadata.product_event_type", "metadata.product_name", "principal.user.userid"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Misconfigured automation after a policy change; security scanners with partial permissions."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
