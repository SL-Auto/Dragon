canonical_sha256: 4b4355ba277543e8fa2f4522bd89b218b54a520db29bce2e5993fd2c60aa2c6a
description: "Detects one principal performing two or more distinct IAM privilege-modifying actions within 30 minutes: policy attachment, inline policy, default policy version, group membership or trust-policy change."
severity: high
procedure_ids: ["PA-P03", "PA-P04"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields."
atomic_event_types: ["AddUserToGroup", "AttachGroupPolicy", "AttachRolePolicy", "CreatePolicyVersion", "PutGroupPolicy", "PutRolePolicy", "PutUserPolicy", "SetDefaultPolicyVersion"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "principal.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Infrastructure-as-code pipelines and identity administrators applying multi-step changes; approve deployment role ARNs."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
