description: "Detects one principal performing two or more kinds of Cognito identity-creation actions within 30 minutes: CreateUserPool, CreateUserPoolClient, CreateIdentityPool, AdminCreateUser or AdminUpdateUserAttributes."
severity: medium
procedure_ids: ["PA-P14"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields."
atomic_event_types: ["AdminCreateUser", "CreateIdentityPool", "CreateUserPoolClient"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "principal.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Application deployment pipelines that provision Cognito resources."
