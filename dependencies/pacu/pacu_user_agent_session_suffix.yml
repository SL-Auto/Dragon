required_udm_fields: ["metadata.id", "metadata.product_event_type", "metadata.product_name", "network.http.user_agent", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Authorized assessments that set the suffix deliberately for deconfliction."
