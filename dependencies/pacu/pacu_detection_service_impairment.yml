description: "Detects actions that stop or remove AWS monitoring: CloudTrail StopLogging, DeleteTrail or UpdateTrail; GuardDuty DeleteDetector, UpdateDetector, CreateIPSet or UpdateIPSet; Config DeleteConfigurationRecorder, StopConfigurationRecorder or DeleteConfigRule; DeleteFlowLogs; CloudWatch DeleteAlarms or DisableAlarmActions."
severity: high
procedure_ids: ["PA-P07"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields."
atomic_event_types: ["CreateIPSet", "DeleteAlarms", "DeleteConfigRule", "DeleteConfigurationRecorder", "DeleteDetector", "DeleteFlowLogs", "DeleteTrail", "StopConfigurationRecorder", "UpdateDetector", "UpdateIPSet", "UpdateTrail"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "principal.ip", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Account decommissioning and approved logging reconfiguration."
