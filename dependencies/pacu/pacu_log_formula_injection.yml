schema_version: 1
tool_id: pacu
rule_name: pacu_log_formula_injection
canonical_path: detections/pacu/yaral/pacu_log_formula_injection.yaral
canonical_sha256: be83fcb1f1b0f846c97f4392d893671a0090ab452d2e5c0fcc9e7167f671f4e3
description: "Detects CreateTrail or RunInstances requests whose name or tag value begins with a spreadsheet formula character (=, +, -, @), used to inject formulas into exported CloudTrail logs."
severity: medium
procedure_ids: ["PA-P13"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; trail name or tag values in additional.fields['name']."
atomic_event_types: []
required_udm_fields: ["additional.fields", "metadata.product_event_type", "metadata.product_name", "principal.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "None expected; a leading hyphen in names is occasionally used."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
