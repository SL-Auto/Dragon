procedure_ids: ["PA-P02", "PA-P11", "PA-P16"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; eventSource in target.application."
atomic_event_types: ["Describe", "List"]
required_udm_fields: ["metadata.product_event_type", "metadata.product_name", "network.http.user_agent", "principal.user.userid", "target.application"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "CSPM, inventory and governance roles."
