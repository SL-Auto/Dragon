description: "Detects one principal resetting an RDS master password (ModifyDBInstance with MasterUserPassword), or performing two or more snapshot-access steps (RDS snapshot creation or restore, EBS volume creation from snapshot, volume attachment, EBS direct snapshot reads) within 30 minutes."
severity: high
procedure_ids: ["PA-P10"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; requestParameters keys in additional.fields; EBS direct API data events enabled for ListSnapshotBlocks and GetSnapshotBlock."
atomic_event_types: ["AttachVolume", "CreateVolume", "ListSnapshotBlocks", "ModifyDBInstance", "RestoreDBInstanceFromDBSnapshot"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "metadata.product_name", "principal.user.userid"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Database administrators and backup or disaster-recovery automation."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md"
