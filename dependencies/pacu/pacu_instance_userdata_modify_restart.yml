schema_version: 1
tool_id: pacu
rule_name: pacu_instance_userdata_modify_restart
canonical_path: detections/pacu/yaral/pacu_instance_userdata_modify_restart.yaral
canonical_sha256: 87d662efd56f13876dc4f2db00fcf6b84e1f00b476f19d49154f574803f58f57
description: "Detects one principal modifying an EC2 instance's user data and starting that instance within 30 minutes, which executes the new user data at boot."
severity: high
procedure_ids: ["PA-P09"]
validation_status: "needs_validation"
telemetry_prerequisites: "AWS CloudTrail management events normalized with metadata.product_name = 'AWS CloudTrail', eventName in metadata.product_event_type, userIdentity ARN in principal.user.userid, userAgent in network.http.user_agent and requestParameters in additional.fields; requestParameters attribute in additional.fields['attribute'] and instanceId in target.resource.name; userIdentity.invokedBy in additional.fields (service-invoked changes excluded, PA-DR-10)."
atomic_event_types: ["ModifyInstanceAttribute", "StartInstances"]
required_udm_fields: ["additional.fields", "metadata.event_timestamp.seconds", "metadata.product_event_type", "metadata.product_name", "principal.ip", "principal.user.userid", "target.resource.name"]
correlation_window: "30m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Configuration changes during maintenance by instance owners."
references: "reports/pacu/source-analysis.md#procedure-analysis; reviews/pacu/detection-review.md; public-rules/comparisons/pacu/pacu_instance_userdata_modify_restart.md"
