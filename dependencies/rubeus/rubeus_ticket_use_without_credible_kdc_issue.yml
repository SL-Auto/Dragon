schema_version: 1
tool_id: rubeus
rule_name: rubeus_ticket_use_without_credible_kdc_issue
canonical_path: detections/rubeus/yaral/rubeus_ticket_use_without_credible_kdc_issue.yaral
canonical_sha256: 5ea01170f1b7b635a5b21a30407104c92c36208fb3557544240ad5e3a80496fc
description: "Detects anomalous Kerberos-authenticated service use without a corresponding observed service-ticket issue, gated on an explicit domain-controller collection-health signal so absence-based logic never fires during known incomplete DC coverage."
severity: high
procedure_ids: ["PROC-008", "PROC-009"]
validation_status: "needs_validation"
telemetry_prerequisites: "Centralize complete 4769 telemetry and resource-side Kerberos service-use/PAC anomaly data with normalized user, source, and service, plus a collection-health event that proves all authoritative domain controllers reported for the correlation window."
atomic_event_types: ["4769", "COLLECTION_HEALTH", "USER_LOGIN"]
required_udm_fields: ["additional.fields", "metadata.event_type", "metadata.product_event_type", "principal.ip", "security_result.auth_details", "target.resource.name", "target.user.userid"]
correlation_window: "12h"
uses_multi_event_correlation: true
uses_aggregation: false
uses_absence_logic: false
false_positives: "Missing DC logs, cached tickets, referrals, cross-realm activity, and parser mismatches; the collection-health gate mitigates but does not eliminate these because health may be reported as true while an individual DC's forwarder is silently stalled."
references: "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md; public-rules/comparisons/rubeus/rubeus_ticket_use_without_credible_kdc_issue.md"
