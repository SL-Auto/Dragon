procedure_ids: ["PROC-007"]
validation_status: "needs_validation"
telemetry_prerequisites: "EDR must expose LsaCallAuthenticationPackage API calls with Kerberos message type, a success/failure result, and the target LUID; caller process, user, and host are required for triage."
