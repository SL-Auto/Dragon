schema_version: 1
tool_id: rubeus
rule_name: rubeus_asrep_single_account_sensitive
canonical_path: detections/rubeus/yaral/rubeus_asrep_single_account_sensitive.yaral
canonical_sha256: 1d3c6021dc3fe12d0ab18b357146b8530fc905b8aa7aa9de1233a7fa55c72618
description: "Detects a successful AS request without pre-authentication data for an account the tenant has classified as high-risk, compensating for targeted single-account AS-REP roasting below the three-account threshold of rubeus_asrep_roast_sequence."
severity: high
procedure_ids: ["PROC-003"]
validation_status: "needs_validation"
telemetry_prerequisites: "DC Security 4768 with PreAuthType, Status, source IP and target account, plus an account-risk enrichment that sets additional.fields[account_risk_tier] = high for privileged, service and other sensitive accounts. Without that enrichment this rule stays silent; the base three-account rule still applies."
atomic_event_types: ["4768"]
required_udm_fields: ["additional.fields", "metadata.id", "metadata.product_event_type", "principal.ip", "target.user.userid"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Sensitive accounts that legitimately have pre-authentication disabled for legacy clients; record them as approved exceptions in the risk enrichment."
references: "RUBEUS_SOURCE_DETECTION_DEEP_DIVE.md; public-rules/comparisons/rubeus/rubeus_asrep_roast_sequence.md; reviews/rubeus/detection-review.md#review-014"
