schema_version: 1
tool_id: rubeus
rule_name: rubeus_s4u_ticket_sequence
canonical_path: detections/rubeus/yaral/rubeus_s4u_ticket_sequence.yaral
canonical_sha256: a6fd72e4b572c019f832e4c219a00e29a333932c3954ddc70c196c27b5f53f18
description: "Detects a service identity making S4U requests against an authoritatively unapproved delegation edge, or requesting S4U tickets across multiple distinct target services when edge-approval enrichment is unavailable."
severity: high
procedure_ids: ["PROC-005"]
validation_status: "needs_validation"
telemetry_prerequisites: "Normalize 4769 with requesting account, client/source, target service, transited services, ticket options, and delegation context, plus an authoritative delegation-edge-approval enrichment keyed by service account and target service. The single-event unapproved-edge branch additionally requires a delegation-inventory enrichment that sets delegation_inventory_evaluated = true; unset UDM booleans read as false, so without that marker the branch would fire on every S4U ticket."
atomic_event_types: ["4769"]
required_udm_fields: ["additional.fields", "metadata.product_event_type", "security_result.description", "target.resource.name", "target.user.userid"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Approved constrained delegation, protocol transition, web front ends, and identity middleware; stale or incomplete delegation-edge enrichment."
