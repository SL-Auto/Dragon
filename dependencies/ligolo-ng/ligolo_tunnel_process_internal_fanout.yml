schema_version: 1
tool_id: ligolo-ng
rule_name: ligolo_tunnel_process_internal_fanout
canonical_path: detections/ligolo-ng/yaral/ligolo_tunnel_process_internal_fanout.yaral
canonical_sha256: ea49c324ec74172123956c8573e684bafb2a43154a91591bc2bfea4cb3118814
description: "Detects one process that holds an outbound connection to a non-internal destination (the tunnel) while connecting to many distinct internal or loopback destinations or ports, which is the host effect of a pivot agent relaying operator traffic and scans into the network."
severity: high
procedure_ids: ["LG-P01", "LG-P04", "LG-P05"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR equivalent) with direction, destination IP and port, host and a stable process ID; optional signature verification status for triage."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_type", "network.direction", "principal.hostname", "principal.process.file.full_path", "principal.process.file.signature_info.verification_status", "principal.process.product_specific_process_id", "target.ip", "target.port"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Unsigned or unverified browsers, collaboration clients, management agents, vulnerability scanners and backup software that combine internet egress with broad internal connectivity. Verified-signed images are excluded; the exclusion fails open when signature enrichment is absent (LG-DR-02)."
references: "reports/ligolo-ng/source-analysis.md#procedure-analysis; reviews/ligolo-ng/detection-review.md"
