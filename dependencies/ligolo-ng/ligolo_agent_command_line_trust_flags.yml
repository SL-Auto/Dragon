schema_version: 1
tool_id: ligolo-ng
rule_name: ligolo_agent_command_line_trust_flags
canonical_path: detections/ligolo-ng/yaral/ligolo_agent_command_line_trust_flags.yaral
canonical_sha256: 5eeab19c362dcb45dabfdd0862ab9220b2a472b145e90f54ed2a78ec7814dd2c
description: "Detects a process started with the agent's compiled flag grammar: a -connect target together with -ignore-cert or -accept-fingerprint followed by a 64-hex-character SHA-256 value. Flag names are fixed in the agent binary and survive renaming the executable."
severity: high
procedure_ids: ["LG-P01", "LG-P09"]
validation_status: "needs_validation"
telemetry_prerequisites: "PROCESS_LAUNCH telemetry (Sysmon Event ID 1, Security 4688 with command line, Linux auditd EXECVE or EDR) with the full command line, image path and host."
atomic_event_types: ["PROCESS_LAUNCH"]
required_udm_fields: ["metadata.event_type", "principal.hostname", "principal.process.file.full_path", "target.process.command_line", "target.process.file.full_path"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Other tools that happen to share both -connect and -ignore-cert or -accept-fingerprint flags; authorized red-team exercises."
references: "reports/ligolo-ng/source-analysis.md#evidence; public-rules/comparisons/ligolo-ng/ligolo_agent_listener_with_tunnel_egress.md; reviews/ligolo-ng/detection-review.md#lg-dr-11"
