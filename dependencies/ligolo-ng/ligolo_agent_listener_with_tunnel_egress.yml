rule_name: ligolo_agent_listener_with_tunnel_egress
canonical_path: detections/ligolo-ng/yaral/ligolo_agent_listener_with_tunnel_egress.yaral
canonical_sha256: cc94941e54cdd003b5fb857a7903b21d39da5f4f409de8276a8c31571138e053
description: "Detects a process that opens a listening socket and accepts an inbound connection while also holding an outbound connection to a non-internal destination. This is the host effect of an agent-side listener used for reverse port forwarding or chaining a second agent."
severity: medium
procedure_ids: ["LG-P07"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry with LISTEN (or bind) and INBOUND accept events for the local process, and OUTBOUND events with destination IP, host and stable process ID."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_type", "network.direction", "principal.hostname", "principal.ip", "principal.process.file.full_path", "principal.process.file.signature_info.verification_status", "principal.process.product_specific_process_id", "target.ip", "target.port"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Peer-to-peer clients, collaboration and conferencing software, remote-support tools, developer servers and update caches; approve by signer and image path."
references: "reports/ligolo-ng/source-analysis.md#procedure-analysis; reviews/ligolo-ng/detection-review.md"
