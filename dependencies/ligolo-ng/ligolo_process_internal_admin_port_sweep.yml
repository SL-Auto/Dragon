schema_version: 1
tool_id: ligolo-ng
rule_name: ligolo_process_internal_admin_port_sweep
canonical_path: detections/ligolo-ng/yaral/ligolo_process_internal_admin_port_sweep.yaral
canonical_sha256: f269328add65e345b73fc2e3669ea265cba8b536a512815c11328cf074578bd4
description: "Detects one unverified process connecting to many distinct internal hosts on administrative service ports within 10 minutes, without requiring a visible tunnel leg. It compensates for pivots whose upstream is an internal proxy, a chained agent or an inbound session that the parser cannot orient."
severity: medium
procedure_ids: ["LG-P02", "LG-P04"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed OUTBOUND NETWORK_CONNECTION telemetry (Sysmon Event ID 3 or EDR) with destination IP and port, host and stable process ID; optional signature verification status."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_type", "network.direction", "principal.hostname", "principal.process.file.full_path", "principal.process.file.signature_info.verification_status", "principal.process.product_specific_process_id", "target.ip", "target.port"]
correlation_window: "10m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Unapproved or unsigned inventory, vulnerability and monitoring scanners and custom administration scripts; approve scanner images and hosts."
