schema_version: 1
tool_id: ligolo-ng
rule_name: ligolo_websocket_default_user_agent
canonical_path: detections/ligolo-ng/yaral/ligolo_websocket_default_user_agent.yaral
canonical_sha256: d543b80870fbe5923e1cfbef62fdf798d19cf77c4484b9e5adf5108f96093b04
description: "Detects HTTP requests carrying Ligolo-ng's hard-coded default WebSocket User-Agent (Chrome 103 on Windows 10 x64) from a source that is not a browser process. Current browsers auto-update far beyond Chrome 103, so this static string is anomalous."
severity: low
procedure_ids: ["LG-P01"]
validation_status: "needs_validation"
telemetry_prerequisites: "Web proxy, NDR or EDR NETWORK_HTTP events with the User-Agent header and source host or IP; the initiating process image where available."
atomic_event_types: ["NETWORK_HTTP"]
required_udm_fields: ["metadata.event_type", "metadata.id", "network.http.user_agent", "principal.ip", "principal.process.file.full_path", "target.hostname"]
correlation_window: "1h"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Legacy embedded browsers or kiosk devices pinned to Chrome 103, and scripts or tools that copy this User-Agent."
references: "reports/ligolo-ng/source-analysis.md#evidence; reviews/ligolo-ng/detection-review.md"
