canonical_sha256: e6cb07a9f58eaa22e554ed3f71bab6aa9a152e4b8e9f61ce260989c35db1b81e
description: "Detects a process that accepts an inbound connection from a non-internal source and then connects to many distinct internal or loopback destinations or ports. This is the bind-mode pivot, where the operator connects into the agent instead of the agent dialing out."
severity: high
procedure_ids: ["LG-P02", "LG-P04", "LG-P05"]
validation_status: "needs_validation"
telemetry_prerequisites: "Process-attributed NETWORK_CONNECTION telemetry with INBOUND direction and remote source IP for the accept (principal.process is the local listening process, per repository convention), plus OUTBOUND events with destination IP and port, host and stable process ID."
atomic_event_types: ["NETWORK_CONNECTION"]
required_udm_fields: ["metadata.event_type", "network.direction", "principal.hostname", "principal.ip", "principal.process.file.full_path", "principal.process.product_specific_process_id", "target.ip", "target.port"]
correlation_window: "15m"
uses_multi_event_correlation: true
uses_aggregation: true
uses_absence_logic: false
false_positives: "Internet-facing reverse proxies, VPN concentrators, load balancers and jump services that accept external clients and forward to internal servers; approve by asset role."
references: "reports/ligolo-ng/source-analysis.md#procedure-analysis; reviews/ligolo-ng/detection-review.md"
